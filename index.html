lue" placeholder="Nombre" class="mt-1 w-full h-11 bg-[#0B0E11] border border-[#232B33] rounded-xl px-4 text-[13px]"></div></div></div><div class="mt-5 flex gap-2"><button onclick="closeTripModal()" class="flex-1 h-11 border border-[#232B33] rounded-full text-[12px]">CANCELAR</button><button onclick="saveTrip()" class="flex-[1.5] h-11 bg-[#C8FF00] text-black font-black rounded-full text-[12px]">CREAR</button></div></div></div>`:''}
  ${showNewReserva?`<div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center"><div onclick="closeReservaModal()" class="absolute inset-0 bg-black/80"></div><div class="relative w-full max-w-[480px] bg-[#10151A] rounded-t-[20px] sm:rounded-[20px] border border-[#1E262F] p-5 max-h-[92vh] overflow-auto"><div class="font-black">NUEVA RESERVA</div><div class="mono text-[10px] text-white/40 mb-4">Buscador conectado a ${clientes.length} clientes • Viajes se cuentan automático</div><div class="space-y-3"><div class="relative"><label class="mono text-[10px] text-white/50">BUSCAR CLIENTE EN BD</label><input value="${formReserva.nombre}" oninput="onClienteSearchInput(this.value)" placeholder="Escribe nombre o teléfono..." class="mt-1 w-full h-11 bg-[#0B0E11] border ${showClienteDropdown?'border-[#C8FF00]':'border-[#232B33]'} rounded-xl px-4 text-[13px]"><div class="mono text-[10px] text-white/30 mt-1">${showClienteDropdown?filteredClienteSearch.length+' coincidencias':''}</div>${showClienteDropdown?`<div class="absolute z-10 mt-2 w-full bg-[#0B0E11] border border-[#232B33] rounded-xl max-h-[160px] overflow-auto">${filteredClienteSearch.map(c=>`<button onclick="selectCliente('${c.id}')" class="w-full text-left p-3 hover:bg-[#151B22] border-b border-[#151B22]"><div class="font-bold text-[12px]">${c.nombre} <span class="mono text-[10px] text-white/40">${c.totalViajes} viajes</span></div><div class="mono text-[11px] text-white/50">${c.telefono}</div></button>`).join('')}</div>`:''}</div><div><label class="mono text-[10px] text-white/50">TELÉFONO *</label><input value="${formReserva.telefono}" oninput="formReserva.telefono=this.value" placeholder="10 dígitos" class="mt-1 w-full h-11 bg-[#0B0E11] border border-[#232B33] rounded-xl px-4 text-[13px]"></div><div><label class="mono text-[10px] text-white/50">SALIDA ${selectedDate}</label><select onchange="formReserva.tripId=this.value" class="mt-1 w-full h-11 bg-[#0B0E11] border border-[#232B33] rounded-xl px-3 text-[12px]"><option value="">Selecciona</option>${trips.filter(t=>t.fecha===selectedDate).map(t=>`<option value="${t.id}" ${formReserva.tripId===t.id?'selected':''}>${t.hora} - ${t.ruta} (${t.lugares})</option>`).join('')}</select></div><div><label class="mono text-[10px] text-white/50">ASIENTOS</label><div class="mt-2 grid grid-cols-5 gap-1.5">${(()=>{const tr=trips.find(t=>t.id===formReserva.tripId);const tot=tr?tr.lugares:20;const occ=tr?reservas.filter(r=>r.tripId===tr.id&&r.estado!=='Cancelado').flatMap(r=>r.asientos):[];return Array.from({length:tot}).map((_,i)=>{const n=i+1;const isOcc=occ.includes(n);const sel=formReserva.asientos.includes(n);return `<button ${isOcc?'disabled':''} onclick="toggleAsiento(${n})" class="h-9 rounded-lg mono text-[11px] font-bold ${isOcc?'bg-[#22C55E] text-black opacity-60':sel?'bg-[#C8FF00] text-black':'bg-[#0B0E11] border border-[#232B33]'}">${n}</button>`;}).join('')})()}</div></div></div><div class="mt-5 flex gap-2"><button onclick="closeReservaModal()" class="flex-1 h-11 border border-[#232B33] rounded-full text-[12px]">CANCELAR</button><button onclick="saveReserva()" class="flex-[1.5] h-11 bg-[#C8FF00] text-black font-black rounded-full text-[12px]">CREAR RESERVA</button></div></div></div>`:''}
  ${showImport?`<div class="fixed inset-0 z-50 flex items-center justify-center p-4"><div onclick="showImport=false;render()" class="absolute inset-0 bg-black/80"></div><div class="relative w-full max-w-[480px] bg-[#10151A] border border-[#1E262F] rounded-[20px] p-5"><div class="font-black">IMPORTAR ${importPreview.length} CLIENTES</div><div class="mt-4 max-h-[300px] overflow-auto space-y-1 mono text-[11px]">${importPreview.slice(0,10).map(c=>`<div class="bg-[#0B0E11] p-2 rounded-lg">${c.nombre} • ${c.telefono}</div>`).join('')}</div><div class="mt-4 flex gap-2"><button onclick="showImport=false;render()" class="flex-1 h-11 border border-[#232B33] rounded-full">CANCELAR</button><button onclick="confirmImport()" class="flex-[1.5] h-11 bg-[#C8FF00] text-black font-black rounded-full">CONFIRMAR</button></div></div></div>`:''}
  `;
}
function login(e){e.preventDefault();const u=document.getElementById('u').value;const p=document.getElementById('p').value;if(u.toLowerCase()==='admin'&&p==='1234'){authed=true;sessionStorage.setItem('rvz_auth','1');render();}else alert('Credenciales incorrectas');}
function logout(){sessionStorage.removeItem('rvz_auth');authed=false;render();}
function setTab(t){activeTab=t;render();}
function selectDate(isoD){selectedDate=isoD;render();}
function changeWeek(d){const dt=new Date(selectedDate);dt.setDate(dt.getDate()+d);selectedDate=iso(dt);render();}
function setSearch(v){search=v;render();}
function setSearchCliente(v){searchCliente=v;render();}
function openTripModal(){showNewTrip=true;render();}
function closeTripModal(){showNewTrip=false;render();}
function saveTrip(){const lugNum=parseInt(formTrip.lugares||'0');if(!formTrip.fecha||!formTrip.ruta||!formTrip.hora||!lugNum||lugNum<1){alert('Completa fecha, ruta, hora y lugares');return;}const nt={id:'t'+Date.now(),fecha:formTrip.fecha,ruta:formTrip.ruta,hora:formTrip.hora,lugares:lugNum,unidad:formTrip.unidad||'Urvan',chofer:formTrip.chofer||'',precio:200};trips=[nt,...trips];save(LS_T,trips);showNewTrip=false;formTrip={fecha:selectedDate,ruta:'',hora:'06:00',lugares:'20',unidad:'',chofer:'',precio:'200'};render();}
function openReservaModal(){formReserva={nombre:'',telefono:'',origen:'Valparaíso',destino:'Zacatecas',tripId:trips.filter(t=>t.fecha===selectedDate)[0]?.id||'',asientos:[],estado:'Pendiente',clienteId:''};showNewReserva=true;filteredClienteSearch=[];showClienteDropdown=false;render();}
function openReservaWithClient(cid){const c=clientes.find(x=>x.id===cid);if(!c)return;formReserva={nombre:c.nombre,telefono:c.telefono,origen:c.origenFav||'Valparaíso',destino:'Zacatecas',tripId:trips.filter(t=>t.fecha===selectedDate)[0]?.id||'',asientos:[],estado:'Pendiente',clienteId:c.id};showNewReserva=true;activeTab='reservas';render();}
function closeReservaModal(){showNewReserva=false;showClienteDropdown=false;render();}
function onClienteSearchInput(val){formReserva.nombre=val;if(val.length<1){filteredClienteSearch=[];showClienteDropdown=false;render();return;}filteredClienteSearch=clientes.filter(c=>c.nombre.toLowerCase().includes(val.toLowerCase())||(c.telefono&&c.telefono.includes(val))).slice(0,8);showClienteDropdown=true;render();}
function selectCliente(cid){const c=clientes.find(x=>x.id===cid);if(!c)return;formReserva.nombre=c.nombre;formReserva.telefono=c.telefono;formReserva.clienteId=c.id;showClienteDropdown=false;render();}
function toggleAsiento(n){const idx=formReserva.asientos.indexOf(n);if(idx>=0)formReserva.asientos.splice(idx,1);else formReserva.asientos.push(n);render();}
function saveReserva(){if(!formReserva.nombre||!formReserva.telefono||!formReserva.tripId||formReserva.asientos.length===0){alert('Nombre, teléfono, salida y asiento');return;}const newId='R-'+Math.floor(1000+Math.random()*9000);const trip=trips.find(t=>t.id===formReserva.tripId);let cli=clientes.find(c=>c.telefono&&formReserva.telefono&&c.telefono.slice(-10)===formReserva.telefono.replace(/\D/g,'').slice(-10));if(!cli){cli={id:'c'+Date.now(),nombre:formReserva.nombre,telefono:formReserva.telefono.replace(/\D/g,'').slice(-10),email:'',notas:'',origenFav:formReserva.origen,totalViajes:0,ultimoViaje:trip.fecha,fechaAlta:new Date().toISOString().slice(0,10),frecuente:false};clientes=[cli,...clientes];}cli.totalViajes=(cli.totalViajes||0)+1;cli.ultimoViaje=trip.fecha;if(cli.totalViajes>=3)cli.frecuente=true;const res={id:newId,nombre:formReserva.nombre,telefono:formReserva.telefono,tripId:formReserva.tripId,asientos:[...formReserva.asientos],estado:formReserva.estado,fecha:trip.fecha};reservas=[res,...reservas];save(LS_C,clientes);save(LS_R,reservas);showNewReserva=false;render();}
function updateEstado(id,nuevo){const idx=reservas.findIndex(r=>r.id===id);if(idx>=0){const prev=reservas[idx].estado;const cli=clientes.find(c=>c.telefono&&reservas[idx].telefono&&c.telefono.slice(-10)===reservas[idx].telefono.replace(/\D/g,'').slice(-10));if(nuevo==='Cancelado'&&prev!=='Cancelado'&&cli){cli.totalViajes=Math.max(0,(cli.totalViajes||1)-1);}if(prev==='Cancelado'&&nuevo!=='Cancelado'&&cli){cli.totalViajes=(cli.totalViajes||0)+1;}reservas[idx].estado=nuevo;save(LS_R,reservas);save(LS_C,clientes);render();}}
function handleExcel(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(evt){const data=new Uint8Array(evt.target.result);const wb=XLSX.read(data,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const json=XLSX.utils.sheet_to_json(ws,{defval:''});const mapped=json.map(row=>{const keys=Object.keys(row);const get=(...names)=>{for(let k of keys){if(names.some(n=>k.toLowerCase().includes(n.toLowerCase()))) return row[k]};return ''};const tel=String(get('phone','telefono','tel','celular','whatsapp')||'').replace(/\D/g,'').slice(-10);const fn=String(get('firstname','nombre','first name')||'').trim();const ln=String(get('lastname','apellido','last name')||'').trim();const name=(fn+' '+ln).trim()||String(get('nombre','name')||'').trim();return {nombre:name.replace(/\d+/g,'').trim(),telefono:tel,email:String(get('email','correo')||''),notas:String(get('note','nota','address')||'')};}).filter(r=>r.nombre&&r.nombre.length>1);importPreview=mapped;showImport=true;render();};reader.readAsArrayBuffer(file);}
function confirmImport(){let added=0;importPreview.forEach(r=>{if(!r.telefono)return;const exist=clientes.find(c=>c.telefono===r.telefono);if(!exist){clientes.push({id:'c'+Date.now()+Math.random(),nombre:r.nombre,telefono:r.telefono,email:r.email,notas:r.notas,origenFav:'Valparaíso',totalViajes:0,ultimoViaje:'',fechaAlta:new Date().toISOString().slice(0,10),frecuente:false});added++;}});save(LS_C,clientes);showImport=false;alert(`Se agregaron ${added} clientes nuevos`);render();}
function exportExcel(){const ws=XLSX.utils.json_to_sheet(clientes.map(c=>({Nombre:c.nombre,Telefono:c.telefono,Email:c.email,OrigenFav:c.origenFav,TotalViajes:c.totalViajes,UltimoViaje:c.ultimoViaje,Frecuente:c.frecuente?'SI':'NO',Notas:c.notas})));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Clientes');XLSX.writeFile(wb,'clientes_rait_valpa_zac.xlsx');}
function openWhats(tel){if(!tel)return;window.open('https://wa.me/52'+tel.replace(/\D/g,''),'_blank');}
if(!clientes){} else render();
</script></body></html>
