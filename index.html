  window.mtRestore = async function(rid, sid){

      if(sid){
        var res = await fetch(SUPA_URL+"/rest/v1/reservas?salida_id=eq."+encodeURIComponent(sid)+"&select=plazas,asiento,eliminado",{headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}});

  };

  }

  var mtFaltaCache={};
  function mtPaintFalta(row, tot){
    try{
      row.setAttribute("data-falta-done","1");
      if(!tot||tot<3)return;
      var host=row.parentElement;
      if(!host||host.querySelector(".mt-falta-icon"))return;
      var msg="Este cliente acumula "+tot+" faltas o cancelaciones";
      var icon=document.createElement("span");
      icon.className="mt-falta-icon";
      icon.textContent="!";
      icon.title=msg;
      icon.style.cssText="margin-left:4px;width:20px;height:20px;border-radius:9999px;background:#DC2626;color:#fff;font-size:13px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;line-height:1";
      icon.addEventListener("click",function(ev){ev.preventDefault();ev.stopPropagation();if(typeof mtMostrarFaltaTip==="function")mtMostrarFaltaTip(ev,msg);else alert(msg);});
      var nameRow=host.querySelector('[class*="flex-wrap"]');
      if(nameRow)nameRow.appendChild(icon);else host.appendChild(icon);
    }catch(e){}
  }
  function injectFaltaIcons(){
    try{
      var nodes=document.querySelectorAll("[data-reserva-id]"),i,row,asiento,tel,need=[],seen={};
      for(i=0;i<nodes.length;i++){
        row=nodes[i];
        asiento=row.getAttribute("data-asiento")||"";
        if(asiento.indexOf("PAQ")===0){row.setAttribute("data-falta-done","1");continue;}
        tel=(typeof mtTelDig==="function"?mtTelDig(row.getAttribute("data-telefono")):String(row.getAttribute("data-telefono")||"").replace(/\D/g,"").slice(-10));
        if(tel.length===10&&mtFaltaCache[tel]!=null){mtPaintFalta(row,mtFaltaCache[tel]);continue;}
        if(tel.length===10&&!seen[tel]){seen[tel]=1;need.push(tel);}
      }
      if(!need.length)return;
      var or=need.map(function(x){return "telefono.eq."+x}).join(",");
      fetch(SUPA_URL+"/rest/v1/clientes?or=("+or+")&select=nombre,telefono,notas",{headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}}).then(function(r){return r.ok?r.json():[]}).then(function(arr){
        var notesByTel={},t,st,f;
        (arr||[]).forEach(function(c){t=typeof mtTelDig==="function"?mtTelDig(c.telefono):String(c.telefono||"").replace(/\D/g,"").slice(-10);if(t.length===10)notesByTel[t]=(notesByTel[t]||"")+"\n"+(c.notas||"");});
        need.forEach(function(x){if(notesByTel[x]==null)notesByTel[x]="";});
        Object.keys(notesByTel).forEach(function(k){
          st=typeof mtChkStatsNotas==="function"?mtChkStatsNotas(notesByTel[k]):{no:0,cum:0};
          f=typeof mtFaltasCliente==="function"?mtFaltasCliente(notesByTel[k]):{total:0};
          mtFaltaCache[k]=Math.max(f.total||0,(st.no||0)+(st.cum||0));
        });
        nodes=document.querySelectorAll("[data-reserva-id]");
        for(i=0;i<nodes.length;i++){
          tel=typeof mtTelDig==="function"?mtTelDig(nodes[i].getAttribute("data-telefono")):String(nodes[i].getAttribute("data-telefono")||"").replace(/\D/g,"").slice(-10);
          if(tel.length===10&&mtFaltaCache[tel]!=null)mtPaintFalta(nodes[i],mtFaltaCache[tel]);
        }
      }).catch(function(){});
    }catch(e){}
  }

  function injectPagIcons(){
    return;
    try{
      var nodes=document.querySelectorAll("[data-reserva-id]");
      if(!nodes.length)return;
      var sid=currentSalidaId||nodes[0].getAttribute("data-salida-id")||"";
      if(!sid)return;
      var cache=mtPagIcoCache[sid],i,row,tel,nom;
      if(cache&&cache.loaded){
        for(i=0;i<nodes.length;i++){
          row=nodes[i];
          tel=typeof mtTelDig==="function"?mtTelDig(row.getAttribute("data-telefono")):String(row.getAttribute("data-telefono")||"").replace(/\D/g,"").slice(-10);
          nom=String(row.getAttribute("data-nombre")||"").trim().toLowerCase();
          if((tel&&cache.tels[tel])||(nom&&cache.tels["n:"+nom]))mtPaintPagIco(row);
        }
        return;
      }
      if(cache&&cache.loading)return;
      mtPagIcoCache[sid]={loading:1,tels:{}};
      fetch(SUPA_URL+"/rest/v1/clientes?select=nombre,telefono,notas&notas=like."+encodeURIComponent("*PAG | "+sid+" |*")+"&limit=2000",{headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}}).then(function(r){return r.ok?r.json():[]}).then(function(arr){
        var tels={};
        (arr||[]).forEach(function(c){
          if(typeof mtPagEnNotas==="function"&&!mtPagEnNotas(c.notas,sid))return;
          var t=typeof mtTelDig==="function"?mtTelDig(c.telefono):String(c.telefono||"").replace(/\D/g,"").slice(-10);
          if(t.length===10)tels[t]=1;
          var n=String(c.nombre||"").trim().toLowerCase();
          if(n)tels["n:"+n]=1;
        });
        mtPagIcoCache[sid]={loaded:1,tels:tels};
        nodes=document.querySelectorAll("[data-reserva-id]");
        for(i=0;i<nodes.length;i++){
          row=nodes[i];
          tel=typeof mtTelDig==="function"?mtTelDig(row.getAttribute("data-telefono")):String(row.getAttribute("data-telefono")||"").replace(/\D/g,"").slice(-10);
          nom=String(row.getAttribute("data-nombre")||"").trim().toLowerCase();
          if((tel&&tels[tel])||(nom&&tels["n:"+nom]))mtPaintPagIco(row);
        }
      }).catch(function(){mtPagIcoCache[sid]={loaded:1,tels:{}}});
    }catch(e){}
  }

          function viajeMsCli(tr){var iso=tripIso(tr);if(!iso||!/^\d{4}-\d{2}-\d{2}$/.test(iso))return 0;var mins=minutosHoraCli(tr&&(tr.horaSalida||tr.hora)||"");if(mins<0)return 0;var p=iso.split("-").map(function(x){return parseInt(x,10)});return new Date(p[0],p[1]-1,p[2],Math.floor(mins/60),mins%60,0,0).getTime()}
          function viajeOkCli(tr){var iso=tripIso(tr),mins=minutosHoraCli(tr&&(tr.horaSalida||tr.hora)||"");return !!(iso&&/^\d{4}-\d{2}-\d{2}$/.test(iso)&&mins>=0)}
          var prox=[],pas=[],salMine,msA,msB;
          for(i=0;i<mine.length;i++){
            salMine=tripDeReserva(mine[i]);
            if(!viajeOkCli(salMine))continue;
            if(tripPasado(salMine))pas.push(mine[i]);else prox.push(mine[i]);
          }
          prox.sort(function(a,b){msA=viajeMsCli(tripDeReserva(a));msB=viajeMsCli(tripDeReserva(b));return msA-msB});
          pas.sort(function(a,b){msA=viajeMsCli(tripDeReserva(a));msB=viajeMsCli(tripDeReserva(b));return msB-msA});
          prox=prox.slice(0,5);
          pas=pas.slice(0,5);
          function cardViaje(r){
            var sal=tripDeReserva(r),iso=tripIso(sal),hora=fmt12(sal.horaSalida||""),tipo=tipoRuta(sal.titulo),s="";
            s+='<div style="background:#fff;border:1px solid #E5E7EB;border-radius:16px;padding:12px;margin-bottom:10px">';
            s+='<div style="font-size:12px;font-weight:800;color:#EA580C">'+esc(iso?fechaLargaCli(iso):"Fecha no disponible")+(hora?(" · "+hora):"")+'</div>';
            var gpsMs=typeof viajeMsCli==="function"?viajeMsCli(sal):0, gpsOn=gpsMs&&Date.now()>=gpsMs-3600000&&Date.now()<=gpsMs+3600000;
            s+='<div style="margin-top:6px;display:flex;align-items:flex-start;gap:8px">';
            s+='<div style="flex:1;min-width:0;font-size:16px;font-weight:800;color:#0F172A;line-height:1.25">'+esc(tipo||r.nombre||"Viaje")+'</div>';
            s+='<div style="flex:1;min-width:140px">';
            if(gpsOn)s+='<button type="button" data-gps-rid="'+esc(r.id)+'" style="width:100%;height:auto;padding:8px 10px;border:0;border-radius:12px;background:#16A34A;color:#fff;font-weight:800;font-size:11px;line-height:1.25;text-align:center">Rastreo en tiempo real del rait</button>';
            else s+='<button type="button" disabled style="width:100%;height:auto;padding:8px 10px;border:0;border-radius:12px;background:#CBD5E1;color:#64748B;font-weight:800;font-size:11px;line-height:1.25;text-align:center;opacity:.7;cursor:not-allowed">Rastreo en tiempo real del rait</button>';
            if(!gpsOn)s+='<div style="margin-top:4px;font-size:10px;font-weight:700;color:#94A3B8;line-height:1.3;text-align:center">GPS disponible 1 hora antes de su salida</div>';
            s+='</div></div>';
            s+='<div style="margin-top:2px;font-size:13px;font-weight:700;color:#111827">'+esc(r.nombre||"")+'</div>';
            s+='<div style="font-size:13px;color:#64748B">'+esc(destLabel(r.rutaParticipante||r.ruta_participante,sal.titulo))+' · '+esc(r.plazas||1)+' plaza(s) · '+esc(r.puntoSalida||r.punto_salida||"")+'</div>';
            if(String(r.empleado||"").toUpperCase().indexOf("APP-PEND")>=0)s+='<div style="margin-top:8px;display:inline-block;font-size:11px;font-weight:800;color:#92400E;background:#FEF3C7;border:1px solid #FDE68A;border-radius:9999px;padding:4px 10px">Pendiente de autorizacion</div>';
            if(arguments[1])s+='<button type="button" data-cancel-rid="'+esc(r.id)+'" style="margin-top:10px;width:100%;height:40px;border:1px solid #FECACA;border-radius:12px;background:#FEF2F2;color:#B91C1C;font-weight:800;font-size:13px">Cancelar reservacion</button>';
            s+='</div>';
            return s;
          }
          html+='<div style="font-size:13px;font-weight:800;letter-spacing:.08em;color:#047857;margin:4px 0 8px">PRÓXIMAS</div>';
          if(!prox.length)html+='<div style="padding:12px 8px 16px;color:#94A3B8;font-weight:700;font-size:13px">No tienes viajes próximos</div>';
          for(i=0;i<prox.length;i++)html+=cardViaje(prox[i],!0);
          html+='<div style="font-size:13px;font-weight:800;letter-spacing:.08em;color:#64748B;margin:16px 0 8px">EN EL PASADO</div>';
          if(!pas.length)html+='<div style="padding:12px 8px;color:#94A3B8;font-weight:700;font-size:13px">Aún no hay viajes pasados</div>';
          for(i=0;i<pas.length;i++)html+=cardViaje(pas[i],!1);
        }
      }
      html+="</div>";
      wrap.innerHTML=html;
      wrap.querySelector('[data-act="salir"]').onclick=function(){if(user)sesBorra();user=null;vista="gate";tripSel=null;pendTrip=null;msg="";paint()};
      wrap.querySelectorAll("[data-dia]").forEach(function(el){el.onclick=function(){wrap._cliDia=el.getAttribute("data-dia");paint()}});
      wrap.querySelectorAll("[data-sem]").forEach(function(el){el.onclick=function(){var n=parseInt(el.getAttribute("data-sem"),10)||0,d=startDom(wrap._cliDia||hoyIso());d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n*7);wrap._cliDia=isoDeDate(d);paint()}});
      wrap.querySelectorAll("[data-det]").forEach(function(el){el.onclick=function(){var id=el.getAttribute("data-det");wrap._detId=String(wrap._detId||"")===id?"":id;paint()}});
      wrap.querySelectorAll("[data-go]").forEach(function(el){el.onclick=function(){vista=el.getAttribute("data-go");tripSel=null;msg="";if(vista==="mis"){if(!user){authTab="login";vista="auth";msg="Entra para ver tus viajes";paint();return}loadMine().then(paint);}else paint()}});
      var need=wrap.querySelector('[data-act="need"]');if(need)need.onclick=function(){if(tripSel)pendTrip=tripSel;wrap._reg={paso:"tel",tel:"",nombre:"",orig:"",id:"",existe:!1};authTab="alta";vista="auth";msg="";paint()};
      wrap.querySelectorAll("[data-gps-rid]").forEach(function(el){el.onclick=function(){wrap._gpsRid=el.getAttribute("data-gps-rid");vista="gps";msg="";loadGpsVeh().then(function(){return loadMine()}).then(paint)}});
      wrap.querySelectorAll("[data-cancel-rid]").forEach(function(el){el.onclick=function(){
        var rid=el.getAttribute("data-cancel-rid"), row=null, k;
        for(k=0;k<mine.length;k++)if(String(mine[k].id)===String(rid))row=mine[k];
        if(!row){toast("No se encontro la reserva");return}
        if(!window.confirm("Estas a punto de cancelar tu viaje, por defecto te mandará a escribirnos un Whatsapp, esto para estar enterados de su cancelación. Esto nos ayuda a mejorar el servicio a todos nuestros usuarios."))return;
        var sid=String(row.salida_id||row.salidaId||""), notas0=String(row.notas||"");
        if(notas0&&notas0.indexOf("BAJA CLIENTE")<0)notas0=(notas0?notas0+"\n":"")+"BAJA CLIENTE CA";
        else if(!notas0)notas0="BAJA CLIENTE CA";
        busy=!0;toast("Cancelando...");
        fetch(CLI_URL+"/rest/v1/reservas?id=eq."+encodeURIComponent(rid),{method:"PATCH",headers:Object.assign({},headers(),{"Content-Type":"application/json"}),body:JSON.stringify({eliminado:true,empleado:"APP-CLI",notas:notas0})}).then(function(r){
          if(!r.ok)return r.text().then(function(tx){throw new Error(tx.slice(0,160))});
          if(!sid)return null;
          return fetch(CLI_URL+"/rest/v1/reservas?salida_id=eq."+encodeURIComponent(sid)+"&select=plazas,asiento,eliminado",{headers:headers()});
        }).then(function(r){
          if(!r||!r.json)return 0;
          return r.json().then(function(rows){
            var tot=ocupadosDe(rows);
            return fetch(CLI_URL+"/rest/v1/trips?id=eq."+encodeURIComponent(sid),{method:"PATCH",headers:Object.assign({},headers(),{"Content-Type":"application/json"}),body:JSON.stringify({ocupados:tot})});
          });
        }).then(function(){
          try{ if(typeof mtGuardaElimClienteOvl==="function") mtGuardaElimClienteOvl(row.nombre,row.telefono,sid,"CA"); }catch(e){}
          busy=!1;toast("Reservacion cancelada");
          try{
            var salWa=tripDeReserva(row),isoWa=tripIso(salWa),horaWa=fmt12(salWa&&salWa.horaSalida||"");
            var txtWa=["Hola, he cancelado mi viaje desde la APP","Nombre: "+(row.nombre||""),"Fecha: "+(isoWa?fechaLargaCli(isoWa):"")+(horaWa?(" · "+horaWa):""),"Ruta: "+tipoRuta(salWa&&salWa.titulo||""),"Plazas: "+(row.plazas||1)].join("\n");
            window.open("https://wa.me/524922233227?text="+encodeURIComponent(txtWa),"_blank");
          }catch(eWa){}
          loadMine().then(loadTrips).then(paint);
        }).catch(function(err){busy=!1;toast(err&&err.message?err.message:"No se pudo cancelar")});
      }});
      wrap.querySelectorAll("[data-trip]").forEach(function(el){el.onclick=function(){var id=el.getAttribute("data-trip");tripSel=null;trips.forEach(function(x){if(String(x.id)===id)tripSel=x});if(!tripSel)return;if(tripPasado(tripSel)){toast("Esta salida ya paso. No se puede reservar.");return}vista="form";msg="";paint()}});
      wrap.querySelectorAll('[data-act="wares"]').forEach(function(el){el.onclick=function(){abrirWaReserva(tripSel)}});
      wrap.querySelectorAll('[data-act="mpago"]').forEach(function(el){el.onclick=function(){window.open(CLI_MPAGO_URL,"_blank","noopener,noreferrer")}});
      var rutaEl=wrap.querySelector('[data-c="ruta"]'),plazEl=wrap.querySelector('[data-c="plazas"]');
      if(rutaEl)rutaEl.onchange=actualizarCosto;
      if(plazEl){plazEl.oninput=actualizarCosto;plazEl.onchange=actualizarCosto}
      actualizarCosto();
      var ok=wrap.querySelector('[data-act="okres"]');
      if(ok)ok.onclick=function(){
        if(busy||!tripSel)return;
        if(tripPasado(tripSel)){toast("Esta salida ya paso. No se puede reservar.");return}
        if(!user){pendTrip=tripSel;wrap._reg={paso:"tel",tel:"",nombre:"",orig:"",id:"",existe:!1};authTab="alta";vista="auth";msg="Registrate o entra para confirmar";paint();return}
        if(!validarFormReserva())return;
        var ruta=String((wrap.querySelector('[data-c="ruta"]')||{}).value||"").toUpperCase();
        var punto=(wrap.querySelector('[data-c="punto"]')||{}).value||"";
        var plazas=Math.max(1,Math.min(6,parseInt((wrap.querySelector('[data-c="plazas"]')||{}).value,10)||1));
        var notas=(wrap.querySelector('[data-c="notas"]')||{}).value||"";
        if(plazas>libresTrip(tripSel)){toast("No se pueden apartar más plazas de las disponibles. Solo empleado o admin puede hacerlo.");return}
        busy=!0;toast("Guardando...");
        var id=String(tripSel.id)+"-cli-"+Date.now();
        var payload={id:id,salida_id:tripSel.id,salidaId:tripSel.id,asiento:"A",nombre:user.nombre,telefono:user.tel,notas:notas||null,plazas:plazas,empleado:"APP-PEND",origen:"App",puntoSalida:punto,punto_salida:punto,rutaParticipante:ruta,ruta_participante:ruta,eliminado:false};
        fetch(CLI_URL+"/rest/v1/reservas",{method:"POST",headers:Object.assign({},headers(),{Prefer:"return=representation"}),body:JSON.stringify(payload)}).then(function(r){
          if(!r.ok)return r.text().then(function(tx){throw new Error(tx.slice(0,180))});
          return fetch(CLI_URL+"/rest/v1/reservas?salida_id=eq."+encodeURIComponent(tripSel.id)+"&select=plazas,asiento,eliminado",{headers:headers()});
        }).then(function(r){return r.json?r.json():[]}).then(function(rows){
          var tot=ocupadosDe(rows);
          return fetch(CLI_URL+"/rest/v1/trips?id=eq."+encodeURIComponent(tripSel.id),{method:"PATCH",headers:headers(),body:JSON.stringify({ocupados:tot})});
        }).then(function(){
          busy=!1;tripSel.ocupados=(parseInt(tripSel.ocupados,10)||0)+plazas;vista="mis";msg="Reserva enviada. Lugares apartados, pendiente de autorizacion del empleado.";
          loadMine().then(loadTrips).then(paint);
        }).catch(function(err){busy=!1;toast(err&&err.message?err.message:"No se pudo reservar")});
      };
    }

    document.body.appendChild(wrap);
    if(user){loadTrips().then(loadMine).then(paint)}else paint();
  }

  window.mtMostrarPortalCliente=mtMostrarPortalCliente;
  window.MT_LOGO=CLI_LOGO;
  function mtIrCotizador(){
    var html="cotizador.html", bare="cotizador";
    fetch(html,{method:"HEAD",cache:"no-store"}).then(function(r){
      location.href=r.ok?html:bare;
    }).catch(function(){location.href=bare});
  }
  window.mtIrCotizador=mtIrCotizador;
  function boot(){
    var el=document.getElementById("mt-float-logo");
    if(el)el.remove();
    if(/#(mtto|mantenimiento)/i.test(String(location.hash||""))){location.replace("mantenimiento.html");return}if(/#cotizador/i.test(String(location.hash||""))){mtIrCotizador();return}if(staffSesion())return;
    if(sesLee()||String(location.hash||"").indexOf("#reservar")===0)mtMostrarPortalCliente();
    else mtMostrarPortalCliente();
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);
  else boot();
})();
</script>
