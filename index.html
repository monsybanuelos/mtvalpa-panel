  function mtPaqParseNotas(notas){
    notas=String(notas||'');
    var reco='', costo='', entregaP='', recibe='', changed=true;
    while(changed){
      changed=false;
      var m1=notas.match(/^Recolecci[o\u00f3]n:\s*(.+)/i);
      if(m1){ reco=m1[1].split('\n')[0].trim(); notas=notas.replace(/^Recolecci[o\u00f3]n:\s*.+(\n|$)/i,'').replace(/^\n/,''); changed=true; continue; }

      if(m2){ costo=m2[1].split('\n')[0].trim(); notas=notas.replace(/^Costo:\s*.+(\n|$)/i,'').replace(/^\n/,''); changed=true; continue; }

    if(!node) return;
    var el=node.hasAttribute&&node.hasAttribute('data-reserva-id')?node:node.querySelector&&node.querySelector('[data-reserva-id]');
    if(!el) return;
    currentReservaData={id:el.getAttribute('data-reserva-id'), salidaId:el.getAttribute('data-salida-id'), nombre:el.getAttribute('data-nombre')||'', plazas:el.getAttribute('data-plazas')||'1', telefono:el.getAttribute('data-telefono')||'', asiento:el.getAttribute('data-asiento')||'', puntoSalida:el.getAttribute('data-puntoSalida')||'', notas:el.getAttribute('data-notas')||''};
    currentSalidaId=currentReservaData.salidaId||currentSalidaId;
  }

  setInterval(function(){
    if(typeof window.showParticipanteModal==='function' && !window.showParticipanteModal._mtWrapped){
      var orig=window.showParticipanteModal;
      var wrapped=function(f){
        if(f&&f.id){
          currentReservaData={id:f.id, salidaId:f.salidaId||f.salida_id||'', nombre:f.nombre||'', plazas:String(f.plazas||1), telefono:f.telefono||'', asiento:f.asiento||'', puntoSalida:f.puntoSalida||'', notas:f.notas||''};
          currentSalidaId=currentReservaData.salidaId||currentSalidaId;
        }
        return orig.apply(this, arguments);
      };
      wrapped._mtWrapped=true;
      window.showParticipanteModal=wrapped;
    }
  }, 400);

  document.addEventListener('click', function(e){
    rememberReservaFromNode(e.target.closest('[data-reserva-id]')||e.target.closest('button'));
  }, true);

  document.addEventListener('click', function(e){
    var btn=e.target.closest('button');
    if(!btn) return;
    if(mtSoloLectura()) return;
    if(btn.closest('.mt-eliminados-v63')||btn.closest('.mt-paqueteria-v63')||btn.classList.contains('mt-btn-add-paq')) return;
    var txt=btn.textContent.replace(/\s+/g,' ').trim().toLowerCase();
    if(txt!=='eliminar') return;
    var visible=document.body.innerText||'';
    if(visible.indexOf('Total viajes del cliente')===-1 && visible.indexOf('Participantes')===-1) return;
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
    if(!currentReservaData||!currentReservaData.id){
      var hit=document.querySelector('[data-reserva-id]');
      rememberReservaFromNode(hit);
    }
    if(!currentReservaData||!currentReservaData.id){ alert('No se detectó el participante'); return false; }
    window.mtDeleteParticipant(currentReservaData.id, currentReservaData.salidaId, currentReservaData.nombre, currentReservaData.plazas, currentReservaData.telefono, currentReservaData.asiento);
    return false;
  }, true);

  function attachControls(node){
    if(mtSoloLectura()) return;
    if(!node) return;
    if(node.querySelector('.mt-ctrl-v63')) return;
    if(node.textContent.indexOf('viajes totales')===-1) return;
    var old=node.querySelectorAll('.mt-ctrl-v59, .mt-ctrl-v60, .mt-ctrl-v61, .mt-ctrl-v62');
    for(var o=0;o<old.length;o++) old[o].remove();
    var rid=node.getAttribute('data-reserva-id');
    var sid=node.getAttribute('data-salida-id');
    var plazas=node.getAttribute('data-plazas')||'1';
    var puntoActual=node.getAttribute('data-puntoSalida')||'';
    var notas=node.getAttribute('data-notas')||'';
    var asiento=node.getAttribute('data-asiento')||'';
    if(!rid) return;
    currentSalidaId=sid||currentSalidaId;

    var ctrl=document.createElement('div');
    ctrl.className='mt-ctrl-v63 mt-3 flex flex-col gap-3';

    var html='';
    var esPaq = asiento && asiento.indexOf('PAQ')===0;
    if(esPaq){
      html+='<div style="background:#EEF2FF;border:1.5px solid #C7D2FE;border-radius:12px;padding:10px"><div style="font-size:11px;font-weight:bold;color:#3730A3">📦 PAQUETERÍA - NO OCUPA LUGAR</div><div style="font-size:11px;color:#4F46E5;margin-top:4px">Asiento: '+asiento+' • No cuenta en ocupados</div></div>';
    }
    var notasShow=esPaq?mtPaqParseNotas(notas).notas:String(notas||"").split("\n").filter(function(l){return l.indexOf("CHK | ")!==0&&l.indexOf("PAG | ")!==0&&l.indexOf("ELIM | ")!==0}).join("\n").trim();
    if(notasShow){
      html+='<div style="background:#FFFBEB;border:1.5px solid #FDE68A;border-radius:12px;padding:10px"><div style="font-size:11px;font-weight:bold;color:#92400E;margin-bottom:4px">💬 COMENTARIO:</div><div style="font-size:12px;color:#78350F;white-space:pre-wrap">'+notasShow.replace(/</g,'&lt;')+'</div></div>';
    }
    if(!esPaq){
      html+='<div style="display:flex;gap:8px;align-items:center;background:white;padding:10px;border-radius:12px;border:1px solid #E5E7EB"><span style="font-size:11px;font-weight:bold;color:#065F46">PLAZAS:</span><select class="mt-sel-plazas" style="flex:1;height:38px;border-radius:9999px;border:2px solid #10B981;background:#ECFDF5;color:#065F46;font-weight:bold;padding:0 12px"><option value="1">1 plaza</option><option value="2">2 plazas</option><option value="3">3 plazas</option><option value="4">4 plazas</option><option value="5">5 plazas</option><option value="6">6 plazas</option></select><button type="button" class="mt-btn-plazas" style="height:38px;padding:0 14px;border-radius:9999px;background:#10B981;color:white;font-weight:bold;border:none">Guardar</button></div>';
    }
    if(esPaq){
      var parsedN=mtPaqParseNotas(notas);
      html+='<div style="display:flex;flex-direction:column;gap:6px;background:white;padding:10px;border-radius:12px;border:1px solid #E5E7EB"><div style="font-size:11px;font-weight:bold;color:#374151">📦 Recolección</div><select class="mt-sel-reco" style="height:38px;border-radius:12px;border:1.5px solid #D1D5DB;background:white;padding:0 10px;font-size:12px">'+mtOptsPuntosPaq(parsedN.reco)+'</select><div style="font-size:11px;font-weight:bold;color:#1D4ED8;margin-top:4px">📍 Punto de entrega</div><select class="mt-sel-punto" style="height:38px;border-radius:12px;border:1.5px solid #2563EB;background:#EFF6FF;padding:0 10px;font-size:12px">'+mtOptsPuntosPaq(puntoActual)+'</select><div style="font-size:11px;font-weight:bold;color:#065F46;margin-top:4px">Costo *</div><input class="mt-inp-costo" type="number" min="1" step="1" inputmode="numeric" value="'+(parsedN.costo||'').replace(/"/g,'')+'" placeholder="Obligatorio" style="height:38px;border-radius:12px;border:1.5px solid #059669;background:#ECFDF5;padding:0 10px;font-size:14px;font-weight:700"><button type="button" class="mt-btn-punto" style="height:38px;border-radius:12px;background:#2563EB;color:white;font-weight:bold;border:none">Guardar puntos y costo</button></div>';
    }else{
      html+='<div style="display:flex;flex-direction:column;gap:6px;background:white;padding:10px;border-radius:12px;border:1px solid #E5E7EB"><div style="font-size:11px;font-weight:bold;color:#374151">📍 PUNTO SALIDA</div><select class="mt-sel-punto" style="height:38px;border-radius:12px;border:1.5px solid #D1D5DB;background:white;padding:0 10px;font-size:12px"><option value="">Cargando puntos...</option></select><button type="button" class="mt-btn-punto" style="height:38px;border-radius:12px;background:#2563EB;color:white;font-weight:bold;border:none">Guardar punto</button></div>';
    }

    ctrl.innerHTML=html;

    var selPlazas=ctrl.querySelector('.mt-sel-plazas');
    if(selPlazas){
      var m=node.textContent.match(/(\d+)\s*plaza/);
      selPlazas.value=m?m[1]:plazas;
      ctrl.querySelector('.mt-btn-plazas').onclick=function(ev){
        ev.stopPropagation();
        var v=parseInt(selPlazas.value,10);
        fetch(SUPA_URL+"/rest/v1/reservas?id=eq."+encodeURIComponent(rid),{method:"PATCH",headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json"},body:JSON.stringify({plazas:v})}).then(function(r){
          if(r.ok){
            fetch(SUPA_URL+"/rest/v1/reservas?salida_id=eq."+encodeURIComponent(sid)+"&select=plazas,asiento,eliminado",{headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}}).then(function(res){return res.json();}).then(function(data){ var total=0; for(var i=0;i<data.length;i++){ if(!data[i].eliminado && !(data[i].asiento&&data[i].asiento.indexOf('PAQ')===0)) total+=(data[i].plazas||1); } fetch(SUPA_URL+"/rest/v1/trips?id=eq."+encodeURIComponent(sid),{method:"PATCH",headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json"},body:JSON.stringify({ocupados:total})}).then(function(){ alert('Guardado '+v+'p'); location.reload(); }); });
          }
        });
      };
    }

    var selPunto=ctrl.querySelector('.mt-sel-punto');
    var btnPunto=ctrl.querySelector('.mt-btn-punto');
    var selReco=ctrl.querySelector('.mt-sel-reco');
    if(!esPaq){
      loadPuntosSalida().then(function(puntos){
        var h='<option value="">-- Selecciona punto --</option>';
        for(var i=0;i<puntos.length;i++){ var p=puntos[i]; var sel=(p===puntoActual)?' selected':''; h+='<option value="'+p.replace(/"/g,'&quot;')+'"'+sel+'>'+p+'</option>'; }
        h+='<option value="__custom__">+ Otro (escribir)</option>';
        selPunto.innerHTML=h;
      });
    }
    btnPunto.onclick=function(ev){
      ev.stopPropagation();
      var val=selPunto.value;
      if(val==='__custom__'){ val=prompt('Escribe punto:', puntoActual||''); if(!val) return; }
      if(!val) return;
      var body={puntoSalida:val, punto_salida:val};
      if(esPaq&&selReco){
        var parsedSave=mtPaqParseNotas(notas);
        var inpC=ctrl.querySelector('.mt-inp-costo');
        var costoV=inpC?String(inpC.value||'').trim().replace(',','.'):parsedSave.costo;
        var costoN=parseFloat(costoV);
        if(!costoV || isNaN(costoN) || costoN<=0){ alert('El costo es obligatorio'); return; }
        body.notas=mtPaqJoinNotas(selReco.value, Math.round(costoN), parsedSave.notas, parsedSave.entregaPersona, parsedSave.recibe);
      }
      fetch(SUPA_URL+"/rest/v1/reservas?id=eq."+encodeURIComponent(rid),{method:"PATCH",headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){ if(r.ok){ alert(esPaq?('Guardado: reco '+((selReco&&selReco.value)||'')+' → entrega '+val):('Punto guardado: '+val)); location.reload(); } });
    };

    node.appendChild(ctrl);
  }

  function renderPaqueteriaYEliminados(){
    var modals=mtSheetModals();
    for(var mi=0;mi<modals.length;mi++){
      var cont=modals[mi];
      if(cont.textContent.indexOf('Participantes')===-1) continue;
      var sid=currentSalidaId;
      var el=cont.querySelector('[data-salida-id]')||document.querySelector('[data-salida-id]');
      if(el) sid=el.getAttribute('data-salida-id');
      if(sid) currentSalidaId=sid;
      if(!sid) continue;

      // PAQUETERIA
      if(!cont.querySelector('.mt-paqueteria-v63')){
        var sectionPaq=document.createElement('div');
        sectionPaq.className='mt-paqueteria-v63 mt-4 border-t-2 border-dashed border-[#818CF8] pt-4 bg-[#F5F3FF] rounded-xl mx-2 mb-2';
        sectionPaq.innerHTML='<div style="font-size:12px;font-weight:bold;color:#3730A3;padding:0 16px;margin-bottom:12px">📦 Paquetería</div><div class="mt-paqueteria-list-v63 px-2"><div style="padding:12px;text-align:center;color:#9CA3AF;font-size:11px">Cargando paquetería...</div></div>';
        var scrollArea=cont.querySelector('div.flex-1.overflow-y-auto')||cont;
        scrollArea.appendChild(sectionPaq);
        (function(sec,sId){
          fetch(SUPA_URL+"/rest/v1/reservas?salida_id=eq."+encodeURIComponent(sId)+"&asiento=like.PAQ%25&eliminado=eq.false&select=*",{headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}}).then(function(r){return r.json();}).then(function(data){
            var list=sec.querySelector('.mt-paqueteria-list-v63');
            if(!data || data.length===0){
              list.innerHTML=mtSoloLectura()?'<div style="padding:12px;text-align:center;color:#9CA3AF;font-size:11px">Sin paquetería en esta salida</div>':'<div style="padding:12px;text-align:center;color:#9CA3AF;font-size:11px">Sin paquetería en esta salida<br><span style="font-size:10px">Usa 📦 Agregar paquetería - no ocupa lugar</span></div>';
              return;
            }
            var html='';
            for(var i=0;i<data.length;i++){
              var d=data[i];
              var pn=mtPaqParseNotas(d.notas);
              var pts=(pn.reco?('Reco: '+pn.reco+' → '):'')+'Entrega: '+(d.puntoSalida||'');
              html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:white;border:1px solid #C7D2FE;border-radius:12px;margin-bottom:8px"><div style="flex:1"><div style="font-weight:600;color:#3730A3;font-size:13px">📦 '+(d.nombre||'')+' <span style="font-size:9px;background:#EEF2FF;padding:2px 6px;border-radius:9999px;border:1px solid #C7D2FE">'+(d.asiento||'PAQ')+'</span>'+(pn.costo?' <span style="font-size:11px;background:#ECFDF5;color:#065F46;padding:2px 6px;border-radius:9999px;border:1px solid #A7F3D0;font-weight:700">$'+pn.costo+'</span>':'')+'</div><div style="font-size:11px;color:#6B7280">📍 '+pts+' • '+(d.telefono||'')+'</div>'+(pn.notas?'<div style="font-size:11px;color:#92400E">💬 '+pn.notas.slice(0,60)+'</div>':'')+'</div>'+(mtSoloLectura()?'':'<button onclick="window.mtDeleteParticipant(\''+d.id+'\',\''+sId+'\',\''+(d.nombre||'').replace(/'/g,'\\\'')+'\',\''+(d.plazas||0)+'\',\''+(d.telefono||'')+'\',\''+(d.asiento||'')+'\')" style="height:32px;padding:0 10px;border-radius:9999px;background:#EEF2FF;border:1px solid #C7D2FE;color:#3730A3;font-weight:bold;font-size:11px">Eliminar</button>')+'</div>';
            }
            list.innerHTML=html;
          });
        })(sectionPaq,sid);
      }

      // ELIMINADOS
      var section=cont.querySelector('.mt-eliminados-v63');
      if(!section){
        section=document.createElement('div');
        section.className='mt-eliminados-v63 mt-4 border-t-2 border-dashed border-[#FCA5A5] pt-4 bg-[#FFFBFB] rounded-xl mx-2 mb-4';
        section.innerHTML='<div style="font-size:12px;font-weight:bold;color:#DC2626;padding:0 16px;margin-bottom:12px">🗑️ PARTICIPANTES ELIMINADOS - de esta salida</div><div class="mt-eliminados-list-v63 px-2"><div style="padding:12px;text-align:center;color:#9CA3AF;font-size:11px">Cargando...</div></div>';
        var scrollArea2=cont.querySelector('div.flex-1.overflow-y-auto')||cont;
        scrollArea2.appendChild(section);
      }
      (function(sec,sId){
        if(sec.getAttribute('data-loaded-sid')===sId && sec.getAttribute('data-loading')==='1') return;
        sec.setAttribute('data-loaded-sid', sId);
        sec.setAttribute('data-loading','1');
        var localElim=[];
        try{ localElim=JSON.parse(localStorage.getItem('mt_valpa_eliminados')||'[]').filter(function(x){return x.salidaId===sId;}); }catch(e){}
        fetch(SUPA_URL+"/rest/v1/reservas?salida_id=eq."+encodeURIComponent(sId)+"&eliminado=eq.true&select=*",{headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}}).then(function(r){return r.json();}).then(function(data){
          sec.setAttribute('data-loading','0');
          var list=sec.querySelector('.mt-eliminados-list-v63');
          var combined=(data||[]).slice();
          for(var i=0;i<localElim.length;i++){ var exists=false; for(var j=0;j<combined.length;j++){ if(combined[j].id===localElim[i].id) exists=true; } if(!exists) combined.push(localElim[i]); }
          if(combined.length===0){
            list.innerHTML='<div style="padding:12px;text-align:center;color:#9CA3AF;font-size:11px">Sin eliminados</div>';
            return;
          }
          var html='';
          for(var i=0;i<combined.length;i++){
            var d=combined[i];
            html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:white;border:1px solid #FECACA;border-radius:12px;margin-bottom:8px"><div style="flex:1"><div style="font-weight:600;color:#991B1B;font-size:13px">'+(d.nombre||'')+' <span style="font-size:10px;background:#FEE2E2;padding:2px 6px;border-radius:9999px">'+(d.plazas||1)+'p</span></div><div style="font-size:11px;color:#9CA3AF">'+(d.telefono||'')+' • '+(d.asiento||'')+'</div></div>'+(mtSoloLectura()?'':'<button onclick="window.mtRestore(\''+d.id+'\',\''+sId+'\')" style="height:32px;padding:0 14px;border-radius:9999px;background:#DC2626;color:white;font-weight:bold;font-size:11px;border:none">Restaurar</button>')+'</div>';
          }
          list.innerHTML=html;
        }).catch(function(){ sec.setAttribute('data-loading','0'); });
      })(section,sid);
    }
  }

  function enhanceRows(){
    var rows=document.querySelectorAll('[data-reserva-id]:not(.mx-5)');
    for(var i=0;i<rows.length;i++){
      var row=rows[i];
      var notas=row.getAttribute('data-notas')||'';
      var asiento=row.getAttribute('data-asiento')||'';
      var esPaq=asiento.indexOf('PAQ')===0;
      if(esPaq){
        row.style.background='#F5F3FF';
        row.style.border='1px dashed #818CF8';
      }
      if(!notas) continue;
      if(row.querySelector('.mt-comment-icon')) continue;
      var right=row.querySelector('div.flex.items-center.gap-1\.5');
      if(!right) continue;
      var icon=document.createElement('button');
      icon.className='mt-comment-icon w-7 h-7 rounded-full bg-[#FFFBEB] border-2 border-[#FBBF24] flex items-center justify-center text-[12px] font-bold';
      icon.textContent='💬';
      icon.title=notas;
      (function(n, nt){
        icon.onclick=function(ev){
          ev.stopPropagation();
          var existing=document.querySelector('.mt-comment-popup');
          if(existing) existing.remove();
          var popup=document.createElement('div');
          popup.className='mt-comment-popup';
          popup.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;border:2px solid #FBBF24;border-radius:16px;padding:16px;z-index:99999;max-width:320px;box-shadow:0 20px 40px rgba(0,0,0,0.2)';
          popup.innerHTML='<div style="font-size:11px;font-weight:bold;color:#92400E;margin-bottom:8px">💬 COMENTARIO DE '+n+'</div><div style="font-size:13px;color:#111827;white-space:pre-wrap;margin-bottom:12px">'+nt.replace(/</g,'&lt;')+'</div><button style="width:100%;height:36px;border-radius:9999px;background:#111827;color:white;font-weight:bold;border:none" onclick="this.parentElement.remove()">Cerrar</button>';
          document.body.appendChild(popup);
        };
      })(row.getAttribute('data-nombre')||'Participante', notas);
      right.insertBefore(icon, right.firstChild);
    }
  }

  var obs=new MutationObserver(function(muts){
    for(var i=0;i<muts.length;i++){
      for(var j=0;j<muts[i].addedNodes.length;j++){
        var node=muts[i].addedNodes[j];
        if(!(node instanceof HTMLElement)) continue;
        if(node.matches && node.matches('div.mx-5')) attachControls(node);
        if(node.querySelectorAll){
          var inner=node.querySelectorAll('div.mx-5');
          for(var k=0;k<inner.length;k++) attachControls(inner[k]);
        }
        if(node.textContent && node.textContent.indexOf('Participantes')>-1){
          setTimeout(function(){ renderPaqueteriaYEliminados(); enhanceRows(); enhanceAddForm(); }, 600);
        }
      }
    }
  });
  obs.observe(document.body,{childList:true,subtree:true});
  setInterval(function(){
    try{
    var all=document.querySelectorAll('div.mx-5');
    for(var i=0;i<all.length;i++) attachControls(all[i]);
    enhanceRows();
    enhanceAddForm();
    var modal=mtSheetModals()[0];
    if(modal && modal.textContent.indexOf('Participantes')>-1){
      var el=modal.querySelector('[data-salida-id]')||document.querySelector('[data-salida-id]');
      if(el) currentSalidaId=el.getAttribute('data-salida-id');
      renderPaqueteriaYEliminados();
    }
    }catch(e){ console.warn('mt overlay', e); }
  }, 800);
  console.log('V6.63 LISTO - paqueteria sin ocupar lugar');
})();
</script>

<script>
