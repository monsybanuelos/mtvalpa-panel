<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MT VALPA - Panel Oficial</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif;background:#080A0C;color:#fff}.mono{font-family:'JetBrains Mono',monospace}</style>
</head>
<body>
<div id="app"></div>
<script>
// ============ CONFIG SUPABASE - PEGA TUS DATOS AQUI ============
const SUPABASE_URL = "https://cwdlpnbrrvflkyvtsukx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yvznbyWS6lPk-gKAwKC7pA_wffg4IOY";
// ===============================================================
const isSupabaseConfigured = !SUPABASE_URL.includes("TU-PROYECTO") && !SUPABASE_ANON_KEY.includes("TU-ANON");
let supabaseClient = null;
if(isSupabaseConfigured){ supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
const LS_C='rvz_clientes_final', LS_R='rvz_reservas_final', LS_T='rvz_trips_final';
let clientes=[], reservas=[], trips=[];
let activeTab='reservas', search='', searchCliente='', selectedDate=new Date().toISOString().slice(0,10);
let showNewTrip=false, showNewReserva=false, authed=!!sessionStorage.getItem('rvz_auth');
let formTrip={fecha:selectedDate,ruta:'Valparaíso - Zacatecas',hora:'06:00',lugares:'20',unidad:'',chofer:'',precio:'200'};
let formReserva={nombre:'',telefono:'',origen:'Valparaíso',destino:'Zacatecas',tripId:'',asientos:[],estado:'Pendiente',clienteId:''};
let filteredClienteSearch=[], showClienteDropdown=false;
let importPreview=[], showImport=false;
function iso(d){return new Date(d).toISOString().slice(0,10)}
function loadLocal(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch{return def}}
async function init(){
  if(isSupabaseConfigured){
    try{
      const c = await supabaseClient.from('clientes').select('*').order('nombre');
      const r = await supabaseClient.from('reservas').select('*').order('created_at',{ascending:false});
      const t = await supabaseClient.from('trips').select('*').order('fecha',{ascending:true});
      if(c.data) clientes=c.data.map(x=>({id:x.id,nombre:x.nombre,telefono:x.telefono,email:x.email||'',notas:x.notas||'',origenFav:x.origen_fav||'Valparaíso',totalViajes:x.total_viajes||0,ultimoViaje:x.ultimo_viaje||'',fechaAlta:x.fecha_alta||'',frecuente:!!x.frecuente}));
      if(r.data) reservas=r.data.map(x=>({id:x.id,nombre:x.nombre,telefono:x.telefono,tripId:x.trip_id,asientos:x.asientos,estado:x.estado,fecha:x.fecha}));
      if(t.data) trips=t.data.map(x=>({id:x.id,fecha:x.fecha,ruta:x.ruta,hora:x.hora,lugares:x.lugares,unidad:x.unidad,chofer:x.chofer,precio:x.precio}));
      supabaseClient.channel('mtvalpa').on('postgres_changes',{event:'*',schema:'public',table:'reservas'},()=>init()).on('postgres_changes',{event:'*',schema:'public',table:'trips'},()=>init()).on('postgres_changes',{event:'*',schema:'public',table:'clientes'},()=>init()).subscribe();
    }catch(e){ console.error(e); loadFallback(); }
  }else{ loadFallback(); }
  render();
}
function loadFallback(){
  clientes=loadLocal(LS_C,[]);
  reservas=loadLocal(LS_R,[]);
  trips=loadLocal(LS_T,[]);
}
function saveLocal(){ localStorage.setItem(LS_C,JSON.stringify(clientes)); localStorage.setItem(LS_R,JSON.stringify(reservas)); localStorage.setItem(LS_T,JSON.stringify(trips)); }
function render(){
  if(!authed){
    document.getElementById('app').innerHTML=`<div class="min-h-screen flex items-center justify-center p-4"><div class="w-full max-w-[380px] bg-[#10151A] border border-[#1E262F] rounded-[24px] p-7"><div class="flex items-center gap-2 mb-6"><div class="w-8 h-8 bg-[#C8FF00] rounded-lg flex items-center justify-center font-black text-black">M</div><div class="font-black">MT VALPA<br><span class="text-[9px] text-zinc-500 tracking-[0.3em]">ZAC • OFICIAL</span></div><div class="ml-auto text-[8px] ${isSupabaseConfigured?'bg-[#C8FF00] text-black':'bg-zinc-800 text-zinc-400'} px-2 py-1 rounded-full font-black">${isSupabaseConfigured?'NUBE ACTIVA':'MODO LOCAL'}</div></div><form onsubmit="login(event)"><input id="u" placeholder="Usuario" class="w-full h-11 bg-[#0B0E11] border border-[#1E262F] rounded-full px-4 text-sm mb-3"><input id="p" type="password" placeholder="Contraseña" class="w-full h-11 bg-[#0B0E11] border border-[#1E262F] rounded-full px-4 text-sm mb-4"><button class="w-full h-11 bg-[#C8FF00] text-black font-black rounded-full">ENTRAR</button></form><p class="mt-3 text-[11px] text-zinc-500 mono text-center">admin / 1234 • ${clientes.length} clientes • ${isSupabaseConfigured?'Conectado a nube':'Sin nube'}</p></div></div>`;return;
  }
  const tripsToday=trips.filter(t=>t.fecha===selectedDate);
  const reservasToday=reservas.filter(r=>r.fecha===selectedDate);
  const filteredReservas=reservasToday.filter(r=>!search||r.nombre.toLowerCase().includes(search.toLowerCase())||r.telefono.includes(search));
  const filteredClientes=clientes.filter(c=>!searchCliente||c.nombre.toLowerCase().includes(searchCliente.toLowerCase())||(c.telefono&&c.telefono.includes(searchCliente))).slice(0,120);
  document.getElementById('app').innerHTML=`
  <div class="min-h-screen bg-[#080A0C]">
    <div class="sticky top-0 z-20 bg-[#0B0E11]/90 backdrop-blur border-b border-[#1E262F] px-4 h-[56px] flex items-center justify-between">
      <div class="flex items-center gap-3"><div class="w-7 h-7 bg-[#C8FF00] rounded-lg flex items-center justify-center font-black text-black text-[11px]">M</div><div class="font-black leading-none text-[13px]">MT VALPA<div class="text-[8px] text-zinc-500 tracking-widest">${isSupabaseConfigured?'<span class="text-[#C8FF00]">NUBE • TIEMPO REAL</span>':'LOCAL'}</div></div><div class="ml-4 hidden md:flex gap-1">${['reservas','salidas','clientes'].map(t=>`<button onclick="setTab('${t}')" class="px-4 h-7 rounded-full text-[10px] font-black ${activeTab===t?'bg-white text-black':'bg-[#1A2129] text-zinc-400'}">${t.toUpperCase()}</button>`).join('')}</div></div>
      <div class="flex items-center gap-2"><span class="mono text-[10px] text-zinc-500">${clientes.length} clientes</span><button onclick="logout()" class="text-[10px] border border-[#232B33] px-3 h-7 rounded-full">SALIR</button></div>
    </div>
    <div class="px-4 py-4 max-w-[1100px] mx-auto">
      ${!isSupabaseConfigured?`<div class="mb-4 bg-yellow-500/10 border border-yellow-500/30 rounded-[12px] p-3 text-[11px]"><b class="text-yellow-300">⚠️ Aún estás en modo LOCAL.</b> Tus empleados no ven lo mismo. Para activar nube: 1) Crea proyecto en supabase.com 2) Copia URL y ANON_KEY 3) Pégalos arriba en index.html (líneas 11-12) 4) Ejecuta el SQL de supabase_schema.sql 5) Haz commit a GitHub → se despliega solo.</div>`:''}
      <div class="flex md:hidden gap-1 mb-4">${['reservas','salidas','clientes'].map(t=>`<button onclick="setTab('${t}')" class="flex-1 h-8 rounded-full text-[10px] font-black ${activeTab===t?'bg-white text-black':'bg-[#1A2129] text-zinc-400'}">${t.toUpperCase()}</button>`).join('')}</div>
      ${activeTab==='reservas'?`<div class="flex flex-wrap gap-2 items-center mb-4"><button onclick="changeWeek(-7)" class="w-8 h-8 rounded-full bg-[#1A2129]">‹</button><input type="date" value="${selectedDate}" onchange="selectDate(this.value)" class="bg-[#10151A] border border-[#1E262F] rounded-full px-3 h-8 text-[12px]"><button onclick="changeWeek(7)" class="w-8 h-8 rounded-full bg-[#1A2129]">›</button><div class="flex-1"></div><input oninput="setSearch(this.value)" value="${search}" placeholder="Buscar..." class="bg-[#0B0E11] border border-[#1E262F] rounded-full px-4 h-8 text-[12px] w-[150px]"><button onclick="openReservaModal()" class="h-8 bg-[#C8FF00] text-black font-black rounded-full px-4 text-[11px]">+ RESERVA</button></div><div class="grid md:grid-cols-3 gap-3 mb-4">${tripsToday.map(t=>{const occ=reservasToday.filter(r=>r.tripId===t.id).reduce((a,b)=>a+b.asientos.length,0);return `<div class="bg-[#10151A] border border-[#1E262F] rounded-[16px] p-3"><div class="flex justify-between"><div class="font-black text-[12px]">${t.ruta}</div><div class="text-[10px] bg-[#1A2129] px-2 py-1 rounded-full">${occ}/${t.lugares}</div></div><div class="mono text-[11px] text-zinc-400 mt-1">${t.hora} • ${t.unidad} ${t.chofer? '• '+t.chofer:''}</div></div>`}).join('')||'<div class="col-span-3 text-center text-zinc-500 py-6">No hay salidas • Crea una en Salidas</div>'}</div><div class="space-y-2">${filteredReservas.map(r=>`<div class="bg-[#10151A] border border-[#1E262F] rounded-[14px] p-3 flex justify-between items-center"><div><div class="font-bold text-[13px]">${r.nombre} <span class="text-zinc-500 text-[10px]">${r.id}</span></div><div class="mono text-[11px] text-zinc-400">${r.telefono} • Asientos ${r.asientos.join(', ')} • ${r.fecha}</div></div><div class="flex gap-1"><select onchange="updateEstado('${r.id}',this.value)" class="bg-[#0B0E11] border border-[#1E262F] rounded-full text-[10px] px-2 h-7"><option ${r.estado==='Pendiente'?'selected':''}>Pendiente</option><option ${r.estado==='Confirmado'?'selected':''}>Confirmado</option><option ${r.estado==='Cancelado'?'selected':''}>Cancelado</option></select><button onclick="openWhats('${r.telefono}')" class="w-7 h-7 rounded-full bg-[#1A2129]">W</button></div></div>`).join('')||'<div class="text-center text-zinc-500 mono text-[12px] py-10">Sin reservas</div>'}</div>`:''}
      ${activeTab==='salidas'?`<div class="flex justify-between mb-4"><div class="font-black">Salidas</div><button onclick="openTripModal()" class="h-8 bg-[#C8FF00] text-black font-black rounded-full px-4 text-[11px]">+ NUEVA SALIDA</button></div><div class="space-y-2">${trips.slice().reverse().slice(0,50).map(t=>`<div class="bg-[#10151A] border border-[#1E262F] rounded-[14px] p-3 flex justify-between"><div><div class="font-bold text-[13px]">${t.fecha} • ${t.ruta} • ${t.hora}</div><div class="mono text-[11px] text-zinc-400">${t.lugares} lugares • ${t.unidad} • ${t.chofer}</div></div><div class="text-[11px] text-zinc-500">${reservas.filter(r=>r.tripId===t.id).length} reservas</div></div>`).join('')}</div>`:''}
      ${activeTab==='clientes'?`<div class="flex gap-2 mb-4"><input oninput="setSearchCliente(this.value)" value="${searchCliente}" placeholder="Buscar cliente..." class="flex-1 bg-[#0B0E11] border border-[#1E262F] rounded-full px-4 h-9 text-[13px]"><input type="file" id="excelFile" accept=".xlsx,.xls,.json" onchange="handleExcel(event)" class="hidden"><label for="excelFile" class="h-9 bg-[#1A2129] rounded-full px-4 flex items-center text-[10px] font-black cursor-pointer">IMPORTAR</label><button onclick="exportExcel()" class="h-9 bg-white text-black rounded-full px-4 text-[10px] font-black">EXPORTAR</button></div><div class="grid md:grid-cols-2 gap-2">${filteredClientes.map(c=>`<div class="bg-[#10151A] border border-[#1E262F] rounded-[14px] p-3 flex justify-between items-center"><div><div class="font-bold text-[13px]">${c.nombre} ${c.frecuente?'<span class="text-[9px] bg-[#C8FF00] text-black px-2 py-0.5 rounded-full ml-1">FREC</span>':''}</div><div class="mono text-[11px] text-zinc-400">${c.telefono||'sin tel'} • ${c.totalViajes} viajes</div></div><div class="flex gap-1"><button onclick="openReservaWithClient('${c.id}')" class="h-7 bg-[#C8FF00] text-black font-black rounded-full px-3 text-[10px]">RESERVAR</button><button onclick="openWhats('${c.telefono}')" class="w-7 h-7 rounded-full bg-[#1A2129] text-[10px]">W</button></div></div>`).join('')}</div>`:''}
    </div>
  </div>
  ${showNewTrip?`<div class="fixed inset-0 z-50 flex items-center justify-center p-4"><div onclick="closeTripModal()" class="absolute inset-0 bg-black/80"></div><div class="relative w-full max-w-[380px] bg-[#10151A] border border-[#1E262F] rounded-[20px] p-5"><div class="font-black mb-4">Nueva salida</div><div class="space-y-3"><input type="date" id="tripFecha" value="${formTrip.fecha}" class="w-full h-11 bg-[#0B0E11] border border-[#1E262F] rounded-full px-4 text-sm"><input id="tripRuta" value="${formTrip.ruta}" placeholder="Ruta" class="w-full h-11 bg-[#0B0E11] border border-[#1E262F] rounded-full px-4 text-sm"><div class="flex gap-2"><input id="tripHora" type="time" value="${formTrip.hora}" class="flex-1 h-11 bg-[#0B0E11] border border-[#1E262F] rounded-full px-4 text-sm"><input id="tripLug" type="number" value="${formTrip.lugares}" class="flex-1 h-11 bg-[#0B0E11] border border-[#1E262F] rounded-full px-4 text-sm"></div><div class="flex gap-2"><input id="tripUni" value="${formTrip.unidad}" placeholder="Unidad" class="flex-1 h-11 bg-[#0B0E11] border border-[#1E262F] rounded-full px-4 text-sm"><input id="tripChof" value="${formTrip.chofer}" placeholder="Chofer" class="flex-1 h-11 bg-[#0B0E11] border border-[#1E262F] rounded-full px-4 text-sm"></div><div class="flex gap-2 mt-2"><button onclick="closeTripModal()" class="flex-1 h-11 border border-[#232B33] rounded-full">Cancelar</button><button onclick="saveTripCloud()" class="flex-[1.5] h-11 bg-[#C8FF00] text-black font-black rounded-full">Guardar ${isSupabaseConfigured?'en NUBE':'local'}</button></div></div></div></div>`:''}
  ${showNewReserva?`<div class="fixed inset-0 z-50 flex items-center justify-center p-4"><div onclick="closeReservaModal()" class="absolute inset-0 bg-black/80"></div><div class="relative w-full max-w-[420px] bg-[#10151A] border border-[#1E262F] rounded-[20px] p-5"><div class="font-black mb-4">Nueva reserva • ${selectedDate}</div><div class="space-y-3"><div class="relative"><input value="${formReserva.nombre}" oninput="onClienteSearchInput(this.value)" placeholder="Nombre" class="w-full h-11 bg-[#0B0E11] border border-[#1E262F] rounded-full px-4 text-sm"><div class="${showClienteDropdown?'':'hidden'} absolute z-10 w-full mt-1 bg-[#0B0E11] border border-[#1E262F] rounded-[12px] overflow-hidden">${filteredClienteSearch.map(c=>`<div onclick="selectCliente('${c.id}')" class="p-2 px-3 hover:bg-[#1A2129] cursor-pointer text-[12px]">${c.nombre} • ${c.telefono}</div>`).join('')}</div></div><input value="${formReserva.telefono}" oninput="formReserva.telefono=this.value" placeholder="Teléfono" class="w-full h-11 bg-[#0B0E11] border border-[#1E262F] rounded-full px-4 text-sm"><select id="resTrip" class="w-full h-11 bg-[#0B0E11] border border-[#1E262F] rounded-full px-4 text-sm">${trips.filter(t=>t.fecha===selectedDate).map(t=>`<option value="${t.id}" ${formReserva.tripId===t.id?'selected':''}>${t.ruta} ${t.hora}</option>`).join('')||'<option>No hay salidas</option>'}</select><div class="grid grid-cols-5 gap-2">${Array.from({length:20},(_,i)=>i+1).map(n=>{const occ=reservas.filter(r=>r.tripId===formReserva.tripId).some(r=>r.asientos.includes(n));const sel=formReserva.asientos.includes(n);return `<button onclick="toggleAsiento(${n})" class="h-9 rounded-full text-[11px] font-black ${occ?'bg-red-900/40 text-red-400': sel?'bg-[#C8FF00] text-black':'bg-[#1A2129]'}">${n}</button>`}).join('')}</div><div class="flex gap-2 mt-2"><button onclick="closeReservaModal()" class="flex-1 h-11 border border-[#232B33] rounded-full">Cancelar</button><button onclick="saveReservaCloud()" class="flex-[1.5] h-11 bg-[#C8FF00] text-black font-black rounded-full">Guardar</button></div></div></div></div>`:''}
  `;
}
function login(e){e.preventDefault();const u=document.getElementById('u').value;const p=document.getElementById('p').value;if(u.toLowerCase()==='admin'&&p==='1234'){authed=true;sessionStorage.setItem('rvz_auth','1');render();}else alert('Incorrecto');}
function logout(){sessionStorage.removeItem('rvz_auth');authed=false;render();}
function setTab(t){activeTab=t;render();}
function selectDate(d){selectedDate=d;render();}
function changeWeek(d){const dt=new Date(selectedDate);dt.setDate(dt.getDate()+d);selectedDate=dt.toISOString().slice(0,10);render();}
function setSearch(v){search=v;render();}
function setSearchCliente(v){searchCliente=v;render();}
function openTripModal(){showNewTrip=true;render();}
function closeTripModal(){showNewTrip=false;render();}
async function saveTripCloud(){
  const fecha=document.getElementById('tripFecha').value;
  const ruta=document.getElementById('tripRuta').value;
  const hora=document.getElementById('tripHora').value;
  const lugares=parseInt(document.getElementById('tripLug').value);
  const unidad=document.getElementById('tripUni').value;
  const chofer=document.getElementById('tripChof').value;
  if(!fecha||!ruta||!hora||!lugares){alert('Completa');return;}
  const nt={id:'t'+Date.now(),fecha,ruta,hora,lugares,unidad,chofer,precio:200};
  trips=[nt,...trips]; saveLocal();
  if(isSupabaseConfigured){ await supabaseClient.from('trips').insert({id:nt.id,fecha:nt.fecha,ruta:nt.ruta,hora:nt.hora,lugares:nt.lugares,unidad:nt.unidad,chofer:nt.chofer,precio:nt.precio}); }
  showNewTrip=false; render();
}
function openReservaModal(){formReserva={nombre:'',telefono:'',origen:'Valparaíso',destino:'Zacatecas',tripId:trips.filter(t=>t.fecha===selectedDate)[0]?.id||'',asientos:[],estado:'Pendiente',clienteId:''};showNewReserva=true;render();}
function openReservaWithClient(cid){const c=clientes.find(x=>x.id===cid);if(!c)return;formReserva={nombre:c.nombre,telefono:c.telefono,origen:c.origenFav||'Valparaíso',destino:'Zacatecas',tripId:trips.filter(t=>t.fecha===selectedDate)[0]?.id||'',asientos:[],estado:'Pendiente',clienteId:c.id};showNewReserva=true;activeTab='reservas';render();}
function closeReservaModal(){showNewReserva=false;render();}
function onClienteSearchInput(val){formReserva.nombre=val;if(val.length<1){filteredClienteSearch=[];showClienteDropdown=false;render();return;}filteredClienteSearch=clientes.filter(c=>c.nombre.toLowerCase().includes(val.toLowerCase())||(c.telefono&&c.telefono.includes(val))).slice(0,8);showClienteDropdown=true;render();}
function selectCliente(cid){const c=clientes.find(x=>x.id===cid);if(!c)return;formReserva.nombre=c.nombre;formReserva.telefono=c.telefono;formReserva.clienteId=c.id;showClienteDropdown=false;render();}
function toggleAsiento(n){const idx=formReserva.asientos.indexOf(n);if(idx>=0)formReserva.asientos.splice(idx,1);else formReserva.asientos.push(n);render();}
async function saveReservaCloud(){
  const tripId=document.getElementById('resTrip')?.value || formReserva.tripId;
  if(!formReserva.nombre||!formReserva.telefono||!tripId||formReserva.asientos.length===0){alert('Faltan datos');return;}
  const newId='R-'+Math.floor(1000+Math.random()*9000);
  const trip=trips.find(t=>t.id===tripId);
  let cli=clientes.find(c=>c.telefono&&formReserva.telefono&&c.telefono.slice(-10)===formReserva.telefono.replace(/\D/g,'').slice(-10));
  if(!cli){cli={id:'c'+Date.now(),nombre:formReserva.nombre,telefono:formReserva.telefono.replace(/\D/g,'').slice(-10),email:'',notas:'',origenFav:formReserva.origen,totalViajes:0,ultimoViaje:trip.fecha,fechaAlta:new Date().toISOString().slice(0,10),frecuente:false}; clientes=[cli,...clientes]; if(isSupabaseConfigured) await supabaseClient.from('clientes').insert({id:cli.id,nombre:cli.nombre,telefono:cli.telefono,email:cli.email,notas:cli.notas,origen_fav:cli.origenFav,total_viajes:cli.totalViajes,ultimo_viaje:cli.ultimoViaje,fecha_alta:cli.fechaAlta,frecuente:cli.frecuente});}
  cli.totalViajes=(cli.totalViajes||0)+1; cli.ultimoViaje=trip.fecha; if(cli.totalViajes>=3) cli.frecuente=true;
  const res={id:newId,nombre:formReserva.nombre,telefono:formReserva.telefono,tripId:tripId,asientos:[...formReserva.asientos],estado:formReserva.estado,fecha:trip.fecha};
  reservas=[res,...reservas]; saveLocal();
  if(isSupabaseConfigured){
    await supabaseClient.from('reservas').insert({id:res.id,nombre:res.nombre,telefono:res.telefono,trip_id:res.tripId,asientos:res.asientos,estado:res.estado,fecha:res.fecha});
    await supabaseClient.from('clientes').update({total_viajes:cli.totalViajes,ultimo_viaje:cli.ultimoViaje,frecuente:cli.frecuente}).eq('id',cli.id);
  }
  showNewReserva=false; render();
}
async function updateEstado(id,nuevo){
  const idx=reservas.findIndex(r=>r.id===id); if(idx<0) return;
  const prev=reservas[idx].estado;
  const cli=clientes.find(c=>c.telefono&&reservas[idx].telefono&&c.telefono.slice(-10)===reservas[idx].telefono.replace(/\D/g,'').slice(-10));
  if(nuevo==='Cancelado'&&prev!=='Cancelado'&&cli){cli.totalViajes=Math.max(0,(cli.totalViajes||1)-1);}
  if(prev==='Cancelado'&&nuevo!=='Cancelado'&&cli){cli.totalViajes=(cli.totalViajes||0)+1;}
  reservas[idx].estado=nuevo; saveLocal();
  if(isSupabaseConfigured){
    await supabaseClient.from('reservas').update({estado:nuevo}).eq('id',id);
    if(cli) await supabaseClient.from('clientes').update({total_viajes:cli.totalViajes}).eq('id',cli.id);
  }
  render();
}


function handleExcel(e){
  const file=e.target.files[0]; if(!file) return;
  const isJson = file.name.toLowerCase().endsWith('.json');
  if(isJson){
    const reader=new FileReader();
    reader.onload=function(evt){
      try{
        const j=JSON.parse(evt.target.result);
        const mapped=j.map(r=>({nombre:String(r.nombre||'').trim(),telefono:String(r.telefono||'').replace(/\D/g,'').slice(-10),email:r.email||'',notas:r.notas||''})).filter(x=>x.nombre&&x.telefono.length>=10);
        if(mapped.length==0){alert('JSON sin clientes');return;}
        importPreview=mapped;showImport=true;render();
      }catch(err){alert('Error JSON: '+err.message);}
    };
    reader.readAsText(file);return;
  }
  const reader=new FileReader();
  reader.onload=function(evt){
    try{
      const data=new Uint8Array(evt.target.result);
      const wb=XLSX.read(data,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const json=XLSX.utils.sheet_to_json(ws,{defval:''});
      const mapped=json.map(row=>{
        const get=(...names)=>{for(let k in row){for(let n of names){if(k.toLowerCase().includes(n.toLowerCase())) return row[k];}} return '';};
        let tel=String(get('phone','telefono','tel','celular','whatsapp')||'').replace(/\D/g,'');
        if(tel.length>10) tel=tel.slice(-10);
        let name=String(get('nombre','name','cliente','firstname')||'').trim();
        const last=String(get('lastname','apellido')||'').trim();
        if(last) name=(name+' '+last).trim();
        return {nombre:name.replace(/\d+/g,'').trim(),telefono:tel,email:String(get('email')||''),notas:String(get('nota','note')||'')};
      }).filter(r=>r.nombre&&r.nombre.length>1&&r.telefono.length>=10);
      if(mapped.length==0){alert('No detecté clientes. Primer fila: '+JSON.stringify(json[0]));return;}
      importPreview=mapped;showImport=true;render();
    }catch(err){alert('Error Excel: '+err.message);}
  };
  reader.readAsArrayBuffer(file);
}


async function confirmImportCloud(){let added=0;for(const r of importPreview){if(!r.telefono) continue; const exist=clientes.find(c=>c.telefono===r.telefono); if(!exist){const nc={id:'c'+Date.now()+Math.random(),nombre:r.nombre,telefono:r.telefono,email:r.email,notas:r.notas,origenFav:'Valparaíso',totalViajes:0,ultimoViaje:'',fechaAlta:new Date().toISOString().slice(0,10),frecuente:false}; clientes.push(nc); added++; if(isSupabaseConfigured){await supabaseClient.from('clientes').insert({id:nc.id,nombre:nc.nombre,telefono:nc.telefono,email:nc.email,notas:nc.notas,origen_fav:nc.origenFav,total_viajes:0,fecha_alta:nc.fechaAlta,frecuente:false});}}} saveLocal(); showImport=false; alert('Se agregaron '+added+' clientes'); render();}
function exportExcel(){const ws=XLSX.utils.json_to_sheet(clientes.map(c=>({Nombre:c.nombre,Telefono:c.telefono,Email:c.email,OrigenFav:c.origenFav,TotalViajes:c.totalViajes,UltimoViaje:c.ultimoViaje,Frecuente:c.frecuente?'SI':'NO',Notas:c.notas})));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Clientes');XLSX.writeFile(wb,'clientes_mt_valpa.xlsx');}
function openWhats(tel){if(!tel)return;window.open('https://wa.me/52'+tel.replace(/\D/g,''),'_blank');}
init();
</script>

<!-- MODAL AGREGAR CLIENTE MANUAL -->
<div id="addClienteModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:100;align-items:center;justify-content:center">
  <div style="background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:24px;width:90%;max-width:400px">
    <h3 style="margin:0 0 16px;font-size:18px;font-weight:900">+ Nuevo Cliente</h3>
    <label style="font-size:12px;color:#888">NOMBRE COMPLETO *</label>
    <input id="newCliNombre" type="text" placeholder="Ej: Juan Pérez" style="width:100%;padding:12px;margin:6px 0 12px;background:#222;border:1px solid #333;border-radius:10px;color:#fff;font-size:14px">
    <label style="font-size:12px;color:#888">NÚMERO WHATSAPP *</label>
    <input id="newCliTel" type="tel" placeholder="Ej: 492 123 4567" style="width:100%;padding:12px;margin:6px 0 12px;background:#222;border:1px solid #333;border-radius:10px;color:#fff;font-size:14px">
    <label style="font-size:12px;color:#888">NOTAS (opcional)</label>
    <textarea id="newCliNotas" placeholder="Ej: Cliente frecuente, paga en Valpa, etc" style="width:100%;padding:12px;margin:6px 0 16px;background:#222;border:1px solid #333;border-radius:10px;color:#fff;font-size:14px;min-height:70px;resize:none"></textarea>
    <div style="display:flex;gap:10px">
      <button onclick="closeAddCliente()" style="flex:1;background:#222;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;font-weight:700;cursor:pointer">CANCELAR</button>
      <button onclick="saveManualCliente()" id="btnSaveCli" style="flex:1;background:var(--neon);color:#000;padding:12px;border-radius:10px;font-weight:900;cursor:pointer;border:none">GUARDAR EN NUBE</button>
    </div>
    <p id="addCliMsg" style="font-size:12px;margin-top:10px;color:#888"></p>
  </div>
</div>
<script>
function openAddCliente(){ document.getElementById('addClienteModal').style.display='flex'; document.getElementById('newCliNombre').focus(); }
function closeAddCliente(){ document.getElementById('addClienteModal').style.display='none'; document.getElementById('newCliNombre').value=''; document.getElementById('newCliTel').value=''; document.getElementById('newCliNotas').value=''; document.getElementById('addCliMsg').textContent=''; }
async function saveManualCliente(){
  const nombre=document.getElementById('newCliNombre').value.trim();
  const telRaw=document.getElementById('newCliTel').value.trim();
  const notas=document.getElementById('newCliNotas').value.trim();
  const msg=document.getElementById('addCliMsg');
  if(!nombre){ msg.textContent='⚠️ Pon el nombre'; return; }
  let tel=telRaw.replace(/\D/g,''); if(tel.length>10) tel=tel.slice(-10);
  if(tel.length<10){ msg.textContent='⚠️ Teléfono debe tener 10 dígitos'; return; }
  document.getElementById('btnSaveCli').textContent='GUARDANDO...';
  document.getElementById('btnSaveCli').disabled=true;
  try{
    const cliente={ id: crypto.randomUUID(), nombre, telefono: tel, email:'', notas, origen_fav:'Valparaíso', total_viajes:0, ultimo_viaje:'', fecha_alta:new Date().toISOString().slice(0,10), frecuente:false };
    const {error} = await supabaseClient.from('clientes').upsert(cliente,{onConflict:'telefono'});
    if(error){ msg.textContent='❌ Error: '+error.message; msg.style.color='#ff4444'; }
    else{
      // add to local array instantly
      if(typeof clientes!=='undefined'){ clientes.unshift(cliente); }
      msg.textContent='✅ Cliente guardado en nube'; msg.style.color='#b4ff00';
      setTimeout(()=>{ closeAddCliente(); if(typeof render==='function') render(); },800);
    }
  }catch(e){ msg.textContent='❌ '+e.message; }
  document.getElementById('btnSaveCli').textContent='GUARDAR EN NUBE';
  document.getElementById('btnSaveCli').disabled=false;
}
</script>


<script>
// FIX BUSCADOR FLUIDO + MODAL CLIENTE
let clienteSearchTerm = '';
function filterClientesLive(val){
  clienteSearchTerm = val.toLowerCase();
  const list = document.getElementById('clientesList');
  if(!list) return;
  const cards = list.querySelectorAll('[data-cliente-card]');
  let visible=0;
  cards.forEach(card=>{
    const txt = card.getAttribute('data-search') || '';
    const show = !clienteSearchTerm || txt.includes(clienteSearchTerm);
    card.style.display = show ? '' : 'none';
    if(show) visible++;
  });
  const counter = document.getElementById('clientesCount');
  if(counter) counter.textContent = visible + ' clientes';
}

// Asegurar modal y boton siempre visibles
function ensureAddButton(){
  const toolbar = document.querySelector('#clientesToolbar');
  if(toolbar && !document.getElementById('btnAddClienteReal')){
    const btn = document.createElement('button');
    btn.id='btnAddClienteReal';
    btn.textContent='+ CLIENTE';
    btn.style.cssText='background:#b4ff00;color:#000;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:900;cursor:pointer;border:none';
    btn.onclick=openAddCliente;
    toolbar.prepend(btn);
  }
}

const originalRender = window.render;
window.render = function(){
  const searchInput = document.getElementById('searchClienteInput');
  const prevTerm = searchInput ? searchInput.value : clienteSearchTerm;
  const wasFocused = document.activeElement && document.activeElement.id==='searchClienteInput';
  const selStart = searchInput ? searchInput.selectionStart : null;
  const selEnd = searchInput ? searchInput.selectionEnd : null;
  
  if(typeof originalRender==='function') originalRender();
  
  // re-aplicar filtro y foco
  const newSearch = document.getElementById('searchClienteInput');
  if(newSearch){
    newSearch.value = prevTerm;
    newSearch.oninput = (e)=>filterClientesLive(e.target.value);
    if(wasFocused){
      newSearch.focus();
      if(selStart!==null) newSearch.setSelectionRange(selStart, selEnd);
    }
  }
  filterClientesLive(prevTerm);
  ensureAddButton();
};

// Inicial
setTimeout(()=>{ ensureAddButton(); const si=document.getElementById('searchClienteInput'); if(si) si.oninput=(e)=>filterClientesLive(e.target.value); }, 500);
</script>

<script>
// Añadir data-search a tarjetas de clientes para busqueda fluida
function tagClientesForSearch(){
  const list=document.getElementById('clientesList');
  if(!list) return;
  list.querySelectorAll('[data-cliente-card]').forEach(card=>{
    if(!card.getAttribute('data-search')){
      card.setAttribute('data-search', card.textContent.toLowerCase());
    }
  });
}
setInterval(tagClientesForSearch, 1000);
</script>
