    html+='<div class="tblwrap"><table><thead><tr><th>FECHA</th><th>TÍTULO</th><th>VEHÍCULO</th><th>TIPO</th><th>KM</th><th>PRÓX.</th><th>MONTO</th><th>COMENTARIOS</th></tr></thead><tbody>';
    list.forEach(function(r){
      html+="<tr><td>"+esc(r.fecha)+"</td><td>"+esc(r.titulo||"—")+"</td><td>"+esc(labVeh(r.vehiculo))+"</td><td>"+esc(labTipo(r.tipo))+"</td><td>"+esc(r.km||"")+"</td><td>"+esc(r.proximoKm||"—")+"</td><td>$"+esc(r.monto||"0")+"</td><td>"+esc(r.comentarios||"")+"</td></tr>";
    });
    html+='<tr class="tot"><td colspan="6">TOTAL</td><td>$'+esc(String(Math.round(tot*100)/100))+'</td><td></td></tr></tbody></table></div>';
    return html;
  }
  function paint(){
    if(esChofer){vista="home";infoEco=""}
    var el=document.getElementById("app");
    el.className="app"+(vista==="list"?" wide":"");
    el.innerHTML=vista==="add"?addView():vista==="list"?listView():home();
    el.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){msg="";infoEco="";vista=b.getAttribute("data-go");if(vista==="list"||vista==="home")load().then(paint);else paint()}});
    var ex=el.querySelector("[data-exit]");if(ex)ex.onclick=function(){if(history.length>1)history.back();else location.href="index.html"};
    el.querySelectorAll("[data-info]").forEach(function(b){b.onclick=function(ev){ev.stopPropagation();infoEco=b.getAttribute("data-info");paint()}});
    el.querySelectorAll("[data-xinfo]").forEach(function(b){b.onclick=function(){infoEco="";paint()}});
    var popc=el.querySelector(".popc");if(popc)popc.onclick=function(ev){ev.stopPropagation()};
    var fv=el.querySelector("[data-fv]");if(fv)fv.onchange=function(){filtVeh=fv.value;paint()};
    var ft=el.querySelector("[data-ft]");if(ft)ft.onchange=function(){filtTipo=ft.value;paint()};
    var x=el.querySelector("[data-xls]");if(x)x.onclick=function(){exportXls(filtered())};
    el.querySelectorAll("[data-k]").forEach(function(inp){inp.oninput=function(){
      var k=inp.getAttribute("data-k");
      form[k]=inp.value;
      if(k==="proximoKm")proxDirty=true;
      if(k==="km"&&form.tipo==="aceite"&&!proxDirty){
        form.proximoKm=nextAceite(form.km);
        var p=el.querySelector('[data-k="proximoKm"]');
        if(p)p.value=form.proximoKm;
      }
    }});
    el.querySelectorAll("[data-veh]").forEach(function(b){b.onclick=function(){form.vehiculo=b.getAttribute("data-veh");paint()}});
    el.querySelectorAll("[data-tipo]").forEach(function(b){b.onclick=function(){
      form.tipo=b.getAttribute("data-tipo");
      if(form.tipo==="aceite"){proxDirty=false;setProxAuto()}
      else{form.proximoKm="";proxDirty=false}
      paint();
    }});
    var sav=el.querySelector("[data-save]");
    if(sav)sav.onclick=function(){
      if(busy)return;
      if(!form.fecha){msg="Elige la fecha";paint();return}
      if(!form.titulo){msg="Escribe el título";paint();return}
      if(!form.vehiculo){msg="Selecciona un vehículo";paint();return}
      if(!form.km){msg="Escribe el kilometraje";paint();return}
      if(!form.tipo){msg="Selecciona el tipo de servicio";paint();return}
      if(form.tipo==="aceite"){setProxAuto();if(!form.proximoKm){msg="Escribe el próximo servicio";paint();return}}
      if(!form.monto){msg="Escribe el monto";paint();return}
      busy=true;msg="";paint();
      load().then(function(list){
        list=list||[];
        var item={id:"m"+Date.now(),fecha:form.fecha,titulo:form.titulo,vehiculo:form.vehiculo,km:form.km,tipo:form.tipo,proximoKm:form.tipo==="aceite"?String(form.proximoKm):"",monto:form.monto,comentarios:form.comentarios,createdAt:new Date().toISOString()};
        list.push(item);
        if(item.tipo==="aceite"){
          proxAceite=proxAceite||{};
          proxAceite[item.vehiculo]={km:item.proximoKm,kmActual:item.km,fecha:item.fecha,itemId:item.id,updatedAt:item.createdAt};
        }
        return saveAll(list);
      }).then(function(){
        busy=false;form={fecha:hoy(),titulo:"",vehiculo:"",km:"",tipo:"",proximoKm:"",monto:"",comentarios:""};proxDirty=false;vista="list";msg="";paint();
      }).catch(function(){busy=false;msg="No se pudo guardar en la nube";paint()});
    };
  }
  load().then(paint).catch(paint);
})();
  </script>
</body>
</html>
