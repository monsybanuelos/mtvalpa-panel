<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cotizador · MB Rait Valpa Zac</title>
  <meta name="theme-color" content="#0f172a">
  <style>
    :root { --bg:#f1f5f9; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --yel:#fef9c3; --blue:#e0f2fe; --ok:#16a34a; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
    .app { max-width:520px; margin:0 auto; min-height:100dvh; padding:12px 14px 40px; }
    .top { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
    .top .grow { flex:1; }
    .back { height:40px; padding:0 14px; border:0; border-radius:999px; background:#0f172a; color:#fff; font-weight:800; font-size:14px; }
    h1 { margin:0; font-size:20px; letter-spacing:-.03em; }
    .sub { margin:2px 0 0; font-size:12px; color:var(--muted); font-weight:700; }
    .sub.ok { color:#047857; }
    .sub.err { color:#b91c1c; }
    .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; }
    h2 { margin:0 0 10px; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
    .parHead { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:8px; }
    .parHead h2 { margin:0; }
    .parFecha { display:none; margin-top:4px; font-size:11px; font-weight:700; color:#64748b; }
    .parFecha.on { display:block; }
    .editBtn { height:36px; padding:0 14px; border:0; border-radius:10px; background:#0f172a; color:#fff; font-weight:800; font-size:13px; flex:none; }
    .editBtn.ok { background:#16a34a; }
    #parEst { display:none; }
    #parEst.on { display:block; }
    #parEst.edit .yel { outline:2px solid #2563eb; }
    .lab { display:block; font-size:11px; font-weight:800; letter-spacing:.06em; color:var(--muted); margin:8px 0 5px; }
    input, select, textarea { width:100%; border:1px solid var(--line); border-radius:12px; padding:0 12px; font-size:15px; font-weight:600; background:#fff; }
    input, select { height:44px; }
    textarea { padding:10px 12px; min-height:72px; resize:vertical; }
    .yel { background:var(--yel); }
    .blu { background:var(--blue); }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .vehRow { display:flex; gap:8px; }
    .chk { flex:1; display:flex; align-items:center; justify-content:center; gap:8px; height:44px; margin:0; padding:0 8px; border:1px solid var(--line); border-radius:12px; background:var(--yel); font-weight:800; font-size:12px; }
    .chk input { width:18px; height:18px; margin:0; accent-color:#0f172a; flex:none; }
    .chk.dis { opacity:.45; pointer-events:none; }
    .tip { position:relative; height:44px; }
    .tipTxt { display:none; position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:6; background:#0f172a; color:#fff; font-size:11px; font-weight:700; line-height:1.35; padding:8px 10px; border-radius:10px; }
    .tip:hover .tipTxt, .tip:focus-within .tipTxt, .tip.on .tipTxt { display:block; }
    .go { width:100%; height:48px; border:0; border-radius:14px; background:#2563eb; color:#fff; font-weight:800; font-size:15px; margin-top:8px; }
    .go.ok { background:#16a34a; }
    .casRow { display:flex; gap:8px; align-items:center; }
    .casRow .casField { flex:2; min-width:0; }
    .casRow .sctCol { flex:1; display:flex; flex-direction:column; gap:8px; }
    .casRow .sctBtn { height:44px; margin:0; padding:4px 6px; border:0; border-radius:12px; background:#0f172a; color:#fff; font-weight:800; font-size:11px; line-height:1.2; display:flex; align-items:center; justify-content:center; text-align:center; text-decoration:none; }
    .sctModal { display:none; position:fixed; inset:0; z-index:80; background:rgba(15,23,42,.55); padding:10px; }
    .sctModal.on { display:flex; }
    .sctPanel { background:#fff; border-radius:16px; width:100%; max-width:920px; margin:auto; height:min(92dvh,820px); display:flex; flex-direction:column; overflow:hidden; }
    .sctHead { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 12px; background:#0f172a; color:#fff; font-weight:800; font-size:13px; }
    .sctHead button { height:32px; padding:0 12px; border:0; border-radius:10px; background:#fff; color:#0f172a; font-weight:800; }
    .sctPanel iframe { flex:1; width:100%; border:0; background:#fff; }
    .aviso { display:none; margin-top:8px; padding:10px; border-radius:12px; font-size:13px; font-weight:800; }
    .aviso.err { display:block; background:#fef2f2; color:#b91c1c; }
    .aviso.ok { display:block; background:#ecfdf5; color:#047857; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { text-align:right; font-size:11px; color:var(--muted); padding:6px 4px; }
    td { padding:6px 4px; border-top:1px solid #f1f5f9; }
    td.n { text-align:right; font-weight:800; }
    .tot td { font-weight:900; background:#0f172a; color:#fff; }
    .nota td { color:#64748b; font-weight:700; font-size:12px; background:#f8fafc; border-top:0; }
    .sec td { background:#f1f5f9; font-weight:900; letter-spacing:.07em; text-transform:uppercase; font-size:11px; color:#64748b; text-align:left; padding-top:12px; }
    .quote { background:#fff; color:#0f172a; border:0; border-radius:22px; padding:18px 16px 16px; box-shadow:0 10px 28px rgba(15,23,42,.08); }
    .qHead { display:flex; flex-direction:row; align-items:center; justify-content:center; gap:12px; padding:0 2px 12px; }
    .qLogo { width:72px; height:72px; flex:none; border-radius:50%; object-fit:cover; background:transparent; }
    .qEmp { min-width:0; text-align:left; }
    .qEmp b { display:block; font-size:16px; font-weight:800; letter-spacing:.04em; line-height:1.15; text-transform:uppercase; }
    .qEmp span { display:block; font-size:13px; font-weight:700; color:#64748b; margin-top:3px; }
    .qAsunto { display:block; width:fit-content; margin:0 auto 14px; padding:5px 10px; border-radius:999px; background:#f1f5f9; color:#334155; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
    .qInfo { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
    .qInfo .full { grid-column:1 / -1; }
    .qInfo i { display:block; background:#f8fafc; border-radius:12px; padding:7px 10px; }
    .qInfo em { display:block; font-style:normal; font-size:9px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#94a3b8; margin-bottom:2px; }
    .qInfo b { display:block; font-size:12px; font-weight:800; line-height:1.25; }
    .qRuta { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; margin:0 0 14px; }
    .qRuta i { display:block; background:#15803d; color:#fff; border-radius:16px; padding:12px; text-align:center; min-height:72px; }
    .qRuta em { display:block; font-style:normal; font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#fff; opacity:.8; margin-bottom:6px; }
    .qRuta b { display:block; font-size:13px; font-weight:800; line-height:1.3; }
    .qArrow { font-size:18px; font-weight:900; color:#cbd5e1; }
    .qMeta { display:flex; gap:8px; margin-bottom:12px; }
    .qMeta span { flex:1; text-align:center; background:#f8fafc; border-radius:12px; padding:8px 6px; font-size:12px; font-weight:800; color:#334155; }
    .qPrices { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
    .qPrice { background:#ecfdf5; border-radius:16px; padding:12px 10px; text-align:center; }
    .qPrice.off { background:#f8fafc; opacity:.55; }
    .qPrice span { display:block; font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:#047857; margin-bottom:4px; }
    .qPrice.off span { color:#94a3b8; }
    .qPrice b { display:block; font-size:22px; font-weight:900; letter-spacing:-.03em; color:#047857; }
    .qPrice.off b { color:#94a3b8; }
    .qObs { background:#f8fafc; border-radius:16px; padding:12px 14px; font-size:12px; font-weight:600; line-height:1.5; white-space:pre-wrap; color:#475569; margin-bottom:10px; }
    .qObs strong { display:block; font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#94a3b8; margin-bottom:6px; }
    .qFoot { text-align:center; font-size:11px; font-weight:600; color:#94a3b8; line-height:1.45; padding:0 6px 8px; }
    .qThanks { text-align:center; font-weight:800; font-size:13px; color:#0f172a; padding-top:4px; }
    .hint { font-size:11px; color:var(--muted); margin-top:6px; }
    .ley { display:flex; gap:10px; font-size:11px; font-weight:700; color:var(--muted); margin-bottom:10px; }
    .dot { width:10px; height:10px; border-radius:3px; display:inline-block; }
    .inpAj { width:100%; height:36px; text-align:right; font-weight:800; font-size:13px; }
    .regBtn { height:36px; padding:0 12px; border:0; border-radius:10px; background:#2563eb; color:#fff; font-weight:800; font-size:12px; }
    .regList { overflow:auto; padding:12px; font-size:13px; }
    .regItem { border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:8px; background:#fff; }
    .regItem b { display:block; margin-bottom:4px; }
    .regTop { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:6px; }
    .regTop b { margin:0; }
    .regEdit { height:32px; padding:0 12px; border:0; border-radius:10px; background:#0f172a; color:#fff; font-weight:800; font-size:12px; flex:none; }
    .blk { margin:0 0 14px; }
    .blkTit { font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#64748b; margin:0 0 8px; }
    .kv { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .kv i { display:block; background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:10px 12px; }
    .kv em { display:block; font-style:normal; font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:#94a3b8; margin-bottom:4px; }
    .kv b { display:block; font-size:14px; font-weight:800; color:#0f172a; line-height:1.3; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; }
    .chip { display:inline-flex; align-items:center; gap:6px; padding:7px 10px; border-radius:999px; font-size:11px; font-weight:800; }
    .chip.on { background:#ecfdf5; color:#047857; }
    .chip.off { background:#f1f5f9; color:#94a3b8; }
    .chip i { width:7px; height:7px; border-radius:50%; background:currentColor; flex:none; }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .stat { background:#0f172a; color:#fff; border-radius:14px; padding:12px; }
    .stat span { display:block; font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; opacity:.65; margin-bottom:4px; }
    .stat b { font-size:20px; font-weight:900; }
    .expRow { display:flex; gap:8px; padding:10px 12px 12px; }
    .expRow .go { margin-top:0; font-size:14px; }
    #expModal .sctPanel { max-width:480px; height:min(96dvh,920px); }
    .prevBox { flex:1; overflow:auto; padding:10px; background:#e2e8f0; }
    .pdfCap { max-width:390px; margin:0 auto; }
    .pdfWait { padding:28px 16px; text-align:center; font-weight:800; color:#64748b; }
    .pdfDoc { width:100%; max-width:390px; margin:0 auto; background:#fff; border-radius:18px; padding:16px 14px 20px; color:#0f172a; }
    .pdfBrand { font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#64748b; }
    .pdfFolio { margin:6px 0 0; font-size:15px; font-weight:900; letter-spacing:.04em; }
    .pdfTit { margin:4px 0 12px; font-size:22px; font-weight:900; letter-spacing:-.03em; }
    .pdfCli { background:#0f172a; color:#fff; border-radius:16px; padding:12px 14px; margin-bottom:12px; }
    .pdfCli b { display:block; font-size:16px; }
    .pdfCli span { display:block; font-size:12px; opacity:.75; margin-top:3px; font-weight:700; }
    .pdfRuta { text-align:center; padding:10px 8px 14px; }
    .pdfRuta b { display:block; font-size:18px; font-weight:900; line-height:1.25; }
    .pdfRuta em { display:block; font-style:normal; font-size:12px; font-weight:800; color:#94a3b8; margin:6px 0; }
    .pdfLin { display:flex; justify-content:space-between; gap:10px; align-items:baseline; padding:7px 0; border-bottom:1px solid #f1f5f9; font-size:13px; font-weight:700; }
    .pdfLin span { color:#475569; }
    .pdfLin b { font-weight:900; white-space:nowrap; }
    .pdfLin.tot { background:#0f172a; color:#fff; border:0; border-radius:10px; padding:9px 10px; margin:6px 0; }
    .pdfLin.tot span { color:#fff; }
    .pdfSec { margin:12px 0 4px; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#64748b; }
    .pdfNota { font-size:12px; font-weight:700; color:#64748b; padding:8px 0; }
    .pdfNota.row { display:flex; justify-content:space-between; gap:8px; }
    .pdfVeh { border:1px solid #e2e8f0; border-radius:16px; padding:12px; margin:12px 0; }
    .pdfVeh h3 { margin:0 0 4px; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:#64748b; }
    .pdfPrice { font-size:28px; font-weight:900; letter-spacing:-.03em; margin:0 0 8px; }
    .pdfCom { margin-top:12px; padding:12px; border-radius:14px; background:#f8fafc; font-size:12px; font-weight:600; line-height:1.45; white-space:pre-wrap; color:#334155; }
    .pdfFoot { margin-top:12px; font-size:10px; font-weight:700; color:#94a3b8; text-align:center; }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <button type="button" class="back" id="back">‹ Volver</button>
      <div class="grow">
        <div class="sub" id="nubeEst">MB RAIT VALPA ZAC · conectando nube…</div>
        <h1>Cotizador</h1>
      </div>
      <button type="button" class="regBtn" id="verRegs">Ver registro de cotizaciones</button>
    </div>
    <div class="ley"><span><i class="dot" style="background:#fde047"></i> Ingreso</span><span><i class="dot" style="background:#38bdf8"></i> Calculado</span></div>

    <div class="card">
      <h2>Cliente</h2>
      <label class="lab">NOMBRE</label>
      <input class="yel" id="nombre" placeholder="Nombre del cliente">
      <label class="lab">TEL. CONTACTO</label>
      <input class="yel" id="tel" placeholder="10 dígitos" inputmode="numeric">
      <div class="grid2">
        <div>
          <label class="lab">FECHA INICIO</label>
          <input class="yel" type="date" id="fini">
        </div>
        <div>
          <label class="lab">FECHA FIN</label>
          <input class="yel" type="date" id="ffin">
        </div>
      </div>
      <div class="grid2">
        <div>
          <label class="lab">NOCHES</label>
          <input class="blu" id="noches" readonly>
        </div>
        <div>
          <label class="lab">DÍAS</label>
          <input class="blu" id="dias" readonly>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Ruta</h2>
      <label class="lab">ORIGEN</label>
      <input class="yel" id="origen" list="ciudadesMx" placeholder="Población, Estado" autocomplete="off">
      <label class="lab">DESTINO</label>
      <input class="yel" id="destino" list="ciudadesMx" placeholder="Población, Estado" autocomplete="off">
      <datalist id="ciudadesMx"></datalist>
      <label class="lab">HORARIO</label>
      <input class="yel" id="horario" placeholder="Ej. 6:00 AM">
      <label class="lab">TIPO DE VIAJE</label>
      <select class="yel" id="tipo">
        <option value="IV">Ida y vuelta</option>
        <option value="I">Solo ida</option>
      </select>
      <div class="grid2">
        <div>
          <label class="lab">CASETAS</label>
          <label class="chk tip" id="casCompLab" tabindex="0">
            <input type="checkbox" id="casComp" checked>
            Casetas completas
            <span class="tipTxt">Considerar si el vehículo regresará y es necesario pagar casetas</span>
          </label>
        </div>
        <div>
          <label class="lab">REGRESO</label>
          <label class="chk tip" id="vueltaDescLab" tabindex="0">
            <input type="checkbox" id="vueltaDesc">
            Vuelta con descuento
            <span class="tipTxt">Aplicar si el cliente va a regresar en el servicio</span>
          </label>
        </div>
      </div>
      <div class="grid2">
        <div>
          <label class="lab">VIÁTICOS</label>
          <label class="chk tip" tabindex="0">
            <input type="checkbox" id="viaChofer" checked>
            Viáticos chofer
            <span class="tipTxt">Aplica cuando al chofer se le pagarán sus comidas por el tiempo</span>
          </label>
        </div>
        <div>
          <label class="lab">CHOFER</label>
          <label class="chk tip" tabindex="0">
            <input type="checkbox" id="diaChofer" checked>
            Día completo chofer
            <span class="tipTxt">Aplica si por las horas es necesario pagarle al chofer día completo. Si no se selecciona, considerar pago por 0.5</span>
          </label>
        </div>
      </div>
      <div class="grid2">
        <div>
          <label class="lab">GASOLINA</label>
          <label class="chk tip" tabindex="0">
            <input type="checkbox" id="gasIV" checked>
            Gasolina ida/vuelta
            <span class="tipTxt">Aplicar el costo de combustible de vuelta completa</span>
          </label>
        </div>
        <div>
          <label class="lab">KM</label>
          <label class="chk tip" tabindex="0">
            <input type="checkbox" id="kmComp" checked>
            Considerar km completos
            <span class="tipTxt">Aplica si el regreso será vacío pero obligatorio</span>
          </label>
        </div>
      </div>
      <button type="button" class="go" id="aceptarRuta">Aceptar</button>
      <div class="grid2">
        <div>
          <label class="lab">KM IDA</label>
          <input class="blu" id="kmIda" type="number" min="0" step="0.01">
        </div>
        <div>
          <label class="lab">KM REGRESO</label>
          <input class="blu" id="kmReg" type="number" min="0" step="0.01">
        </div>
      </div>
      <label class="lab">CASETAS (PEAJE)</label>
      <div class="casRow">
        <div class="casField">
          <input class="blu" id="casetas" type="number" min="0" step="0.01">
        </div>
        <div class="sctCol">
          <button type="button" class="sctBtn" id="abrirSct">Traza tu ruta SCT</button>
          <a class="sctBtn" href="https://app.sct.gob.mx/sibuac_internet/ControllerUI?action=cmdEscogeRuta" target="_blank" rel="noopener">Ir a Sitio SCT</a>
        </div>
      </div>
      <div class="aviso" id="aviso"></div>
      <button type="button" class="go ok" id="aplicarCambios">Aplicar cambios</button>
    </div>

    <div class="card">
      <div class="parHead">
        <div>
          <h2>Parámetros establecidos</h2>
          <div class="parFecha" id="parFecha"></div>
        </div>
        <button type="button" class="editBtn" id="verPar">Ver</button>
      </div>
      <div id="parEst">
      <label class="lab">PRECIO GASOLINA</label>
      <input class="yel" id="gas" type="number" min="0" step="0.01" value="24" readonly>
      <div class="grid2">
        <div>
          <label class="lab">PRECIO POR KM 6 PAS</label>
          <input class="yel" id="tar6" type="number" min="0" step="0.01" value="10" readonly>
        </div>
        <div>
          <label class="lab">PRECIO POR KM 13 PAS</label>
          <input class="yel" id="tar14" type="number" min="0" step="0.01" value="15" readonly>
        </div>
      </div>
      <div class="grid2">
        <div>
          <label class="lab">CAPACIDAD TANQUE LITROS 6 PAS</label>
          <input class="yel" id="lit6" type="number" min="0" step="0.01" value="40" readonly>
        </div>
        <div>
          <label class="lab">CAPACIDAD TANQUE LITROS 13 PAS</label>
          <input class="yel" id="lit14" type="number" min="0" step="0.01" value="60" readonly>
        </div>
      </div>
      <div class="grid2">
        <div>
          <label class="lab">KM POR TANQUE 6 PAS</label>
          <input class="yel" id="tke6" type="number" min="0" step="0.01" value="500" readonly>
        </div>
        <div>
          <label class="lab">KM POR TANQUE 13 PAS</label>
          <input class="yel" id="tke14" type="number" min="0" step="0.01" value="400" readonly>
        </div>
      </div>
      <button type="button" class="go" id="btnParEdit">Editar</button>
      </div>
      <div class="grid2">
        <div>
          <label class="lab">DÍAS VEHÍCULO</label>
          <input class="blu" id="dVeh" type="number" min="0" value="0">
        </div>
        <div>
          <label class="lab">DÍAS CHOFER</label>
          <input class="blu" id="dChofer" type="number" min="0" value="0">
        </div>
      </div>
      <div class="grid2">
        <div>
          <label class="lab">COMIDAS TOTALES</label>
          <input class="blu" id="uComida" type="number" min="0" value="0">
        </div>
        <div>
          <label class="lab">HOTEL</label>
          <input class="yel" id="dHotel" type="number" min="0" value="0">
        </div>
      </div>
      <label class="lab">VEHÍCULO A COTIZAR</label>
      <div class="vehRow">

","Sinaloa"],["Manzanillo","Colima"],["Matamoros","Tamaulipas"],["Matehuala","San Luis Potosí"],["Mazatlán","Sinaloa"],["Mérida","Yucatán"],["Mexicali","Baja California"],["Ciudad de México","Ciudad de México"],["Minatitlán","Veracruz"],["Monclova","Coahuila"],["Montemorelos","Nuevo León"],["Monterrey","Nuevo León"],["Morelia","Michoacán"],["Moroleón","Guanajuato"],["Múzquiz","Coahuila"],["Naucalpan","Estado de México"],["Navojoa","Sonora"],["Nezahualcóyotl","Estado de México"],["Nogales","Sonora"],["Nochistlán","Zacatecas"],["Nuevo Laredo","Tamaulipas"],["Oaxaca","Oaxaca"],["Ocotlán","Jalisco"],["Ojocaliente","Zacatecas"],["Orizaba","Veracruz"],["Pachuca","Hidalgo"],["Parral","Chihuahua"],["Parras","Coahuila"],["Piedras Negras","Coahuila"],["Plateros","Zacatecas"],["Playa del Carmen","Quintana Roo"],["Poza Rica","Veracruz"],["Puebla","Puebla"],["Puerto Escondido","Oaxaca"],["Puerto Peñasco","Sonora"],["Puerto Vallarta","Jalisco"],["Querétaro","Querétaro"],["Reynosa","Tamaulipas"],["Río Grande","Zacatecas"],["Salamanca","Guanajuato"],["Salina Cruz","Oaxaca"],["Saltillo","Coahuila"],["San Cristóbal de las Casas","Chiapas"],["San Juan de los Lagos","Jalisco"],["San Luis Potosí","San Luis Potosí"],["San Luis Río Colorado","Sonora"],["San Miguel de Allende","Guanajuato"],["San Pedro Garza García","Nuevo León"],["Santiago","Nuevo León"],["Silao","Guanajuato"],["Sombrerete","Zacatecas"],["Tampico","Tamaulipas"],["Tapachula","Chiapas"],["Taxco","Guerrero"],["Tehuacán","Puebla"],["Tehuantepec","Oaxaca"],["Tepic","Nayarit"],["Tepatitlán","Jalisco"],["Tequila","Jalisco"],["Texcoco","Estado de México"],["Teziutlán","Puebla"],["Tijuana","Baja California"],["Tlalnepantla","Estado de México"],["Tlaltenango","Zacatecas"],["Tlaquepaque","Jalisco"],["Tlaxcala","Tlaxcala"],["Toluca","Estado de México"],["Tonalá","Jalisco"],["Torreón","Coahuila"],["Tula","Hidalgo"],["Tulancingo","Hidalgo"],["Tulum","Quintana Roo"],["Tuxtla Gutiérrez","Chiapas"],["Uruapan","Michoacán"],["Valle de Bravo","Estado de México"],["Valparaíso","Zacatecas"],["Veracruz","Veracruz"],["Villahermosa","Tabasco"],["Xalapa","Veracruz"],["Zacatecas","Zacatecas"],["Zamora","Michoacán"],["Zapopan","Jalisco"],["Zitácuaro","Michoacán"],["Aeropuerto Aguascalientes","Aguascalientes"],["Aeropuerto CDMX","Ciudad de México"],["Aeropuerto Cancún","Quintana Roo"],["Aeropuerto Guadalajara","Jalisco"],["Aeropuerto Monterrey","Nuevo León"],["Aeropuerto Puerto Vallarta","Jalisco"],["Aeropuerto Tijuana","Baja California"],["Aeropuerto Zacatecas","Zacatecas"]
  ].map(function(x){return x[0]+", "+x[1]});
  var REF_TAXI={
    "aeropuerto":1500,
    "aeropuerto zacatecas":1500,
    "fresnillo":1000,
    "aguascalientes":3500,
    "zacatecas":1800,
    "huejuquilla":600,
    "durango":3500,
    "guadalajara":6000,
    "monterrey":8000,
    "plateros":1200,
    "san juan de los lagos":5000,
    "san luis potosi":4000,
    "tlaltenango":3500,
    "torreon":5000
  };
  function refTaxi(nom){
    var s=normPob(nom);
    if(s==="aeropuerto zac")s="aeropuerto zacatecas";
    if(REF_TAXI[s]!=null)return REF_TAXI[s];
    return null;
  }

  function n(v){var x=parseFloat(String(v).replace(",","."));return isNaN(x)?0:x}
  function money(v){return "$"+Math.round(n(v)).toLocaleString("es-MX")}
  function keyD(a,b){return a+"|"+b}
  function pobNom(nom){return String(nom||"").split(",")[0].trim()}
  function normPob(nom){
    var s=pobNom(nom).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
    if(s.indexOf("valparaiso")===0)return "valparaiso";
    if(s==="aeropuerto zac"||s.indexOf("aeropuerto zacatecas")>=0)return "aeropuerto zacatecas";
    if(s.indexOf("aeropuerto aguascalientes")>=0)return "aeropuerto aguascalientes";
    if(s.indexOf("aeropuerto guadalajara")>=0)return "aeropuerto guadalajara";
    if(s.indexOf("huejuquilla")===0)return "huejuquilla";
    if(s==="san juan lagos"||s.indexOf("san juan de los lagos")===0)return "san juan de los lagos";
    if(s.indexOf("san luis potosi")===0)return "san luis potosi";
    if(s.indexOf("plateros")===0)return "plateros";
    if(s.indexOf("colotlan")===0)return "colotlan";
    return s;
  }
  function kmValpa(o,d){
    var a=normPob(o), b=normPob(d);
    if(a==="valparaiso"&&KM_VALPA[b]!=null)return KM_VALPA[b];
    if(b==="valparaiso"&&KM_VALPA[a]!=null)return KM_VALPA[a];
    return null;
  }
  function sctDe(nom){
    nom=pobNom(nom).toLowerCase();
    return CIUDADES_SCT.filter(function(c){return nom===c.nom.toLowerCase()})[0]||null;
  }
  function distDe(o,d){
    var a=sctDe(o),b=sctDe(d);if(!a||!b)return null;
    return DISTANCIA_TABLA[keyD(a.id,b.id)]||DISTANCIA_TABLA[keyD(b.id,a.id)]||null;
  }
  function peajeComun(o,d){
    var a=normPob(o), b=normPob(d);
    if(!a||!b)return null;
    return PEAJE_COMUN[a+"|"+b]||PEAJE_COMUN[b+"|"+a]||null;
  }
  function peajeDe(o,d){
    var a=sctDe(o),b=sctDe(d);if(!a||!b)return null;
    return PEAJE_TABLA[a.id+"|"+b.id+"|2"]||PEAJE_TABLA[b.id+"|"+a.id+"|2"]||null;
  }
  function calcularPeaje(oNom,dNom){
    var com=peajeComun(oNom,dNom);
    if(com)return Promise.resolve({total:com.total,fecha:com.fecha,fuente:"tabla"});
    var hit=peajeDe(oNom,dNom);
    if(hit)return Promise.resolve(hit);
    var a=sctDe(oNom),b=sctDe(dNom);
    if(!a||!b)return Promise.reject(new Error(AVISO_ERR));
    var body="edoOrigen="+a.edo+"&edoDestino="+b.edo+"&ciudadOrigen="+a.id+"&ciudadDestino="+b.id+"&vehiculos=2&solucion=simplificada";
    return fetch(SCT_URL,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body,mode:"cors"}).then(function(r){if(!r.ok)throw new Error("x");return r.text()}).then(function(html){
      var t=String(html).replace(/<[^>]+>/g," ").replace(/\s+/g," ");
      var m=t.match(/Totales\s+([\d.]+)\s+(\d+:\d+)\s+.*?([\d.]+)/);
      if(!m)throw new Error("x");
      var res={total:parseFloat(m[3]),km:parseFloat(m[1]),hrs:m[2],fuente:"SCT"};
      PEAJE_TABLA[a.id+"|"+b.id+"|2"]=res;
      return res;
    }).catch(function(){throw new Error(AVISO_ERR)});
  }
  window.mtCalcularPeaje=calcularPeaje;
  window.mtDistanciaCarretera=distDe;
  window.mtPeajeAvisoErr=AVISO_ERR;

  var origen=document.getElementById("origen");
  var destino=document.getElementById("destino");
  var dl=document.getElementById("ciudadesMx");
  DESTINOS.slice().sort(function(a,b){return a.localeCompare(b,"es")}).forEach(function(x){dl.appendChild(new Option(x,x))});
  origen.value="";
  destino.value="";
  document.getElementById("kmIda").value="";
  document.getElementById("kmReg").value="";
  document.getElementById("casetas").value="";

  function nomOrigen(){return String(origen.value||"").trim()}
  function nomDestino(){return String(destino.value||"").trim()}

  function aviso(tipo,txt){
    var el=document.getElementById("aviso");
    el.className="aviso"+(tipo?" "+tipo:"");
    el.textContent=txt||"";
  }

  var GEO={};
  function geoCiudad(nom){
    var k=String(nom||"").trim().toLowerCase();
    if(GEO[k])return Promise.resolve(GEO[k]);
    var q=encodeURIComponent(nom+", Mexico");
    return fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=mx&q="+q,{headers:{Accept:"application/json"}}).then(function(r){if(!r.ok)throw new Error("x");return r.json()}).then(function(arr){
      if(!arr||!arr[0])throw new Error("x");
      var g={lat:parseFloat(arr[0].lat),lon:parseFloat(arr[0].lon)};
      GEO[k]=g; return g;
    });
  }
  function obtenerKm(o,d){
    var tab=kmValpa(o,d);
    if(tab!=null)return Promise.resolve(tab);
    var dist=distDe(o,d);
    if(dist&&dist.km)return Promise.resolve(dist.km);
    return geoCiudad(o).then(function(a){
      return geoCiudad(d).then(function(b){
        var url="https://router.project-osrm.org/route/v1/driving/"+a.lon+","+a.lat+";"+b.lon+","+b.lat+"?overview=false";
        return fetch(url).then(function(r){if(!r.ok)throw new Error("x");return r.json()}).then(function(j){
          if(!j.routes||!j.routes[0])throw new Error("x");
          return Math.round(j.routes[0].distance/10)/100;
        });
      });
    });
  }
  var kmIdaBase=0, peajeIda=null;

  function factorTipo(){
    return document.getElementById("tipo").value==="IV"?2:1;
  }
  function factorCasetas(){
    return document.getElementById("casComp").checked?2:1;
  }
  function aplicarRuta(){
    var f=factorTipo();
    if(kmIdaBase){
      document.getElementById("kmIda").value=String(kmIdaBase);
      document.getElementById("kmReg").value=f===2?String(kmIdaBase):"0";
      document.getElementById("kmIda").className="blu";
      document.getElementById("kmReg").className="blu";
    }
    if(peajeIda!=null){
      document.getElementById("casetas").value=String(Math.round(n(peajeIda)*100)/100);
      document.getElementById("casetas").className="blu";
    }
  }

  function rutaAuto(){
    aviso("","");
    var o=nomOrigen(), d=nomDestino();
    var btn=document.getElementById("aceptarRuta");
    if(!o||!d){aviso("err","Selecciona origen y destino");return}
    kmIdaBase=0; peajeIda=null;
    document.getElementById("kmIda").value="";
    document.getElementById("kmReg").value="";
    document.getElementById("casetas").value="";
    document.getElementById("kmIda").className="blu";
    document.getElementById("kmReg").className="blu";
    document.getElementById("casetas").className="blu";
    btn.disabled=true;
    aviso("ok","Calculando km y casetas…");
    obtenerKm(o,d).then(function(km){
      kmIdaBase=km;
      aplicarRuta();
      return calcularPeaje(o,d).then(function(p){
        peajeIda=n(p.total);
        aplicarRuta();
        if(p.fecha)aviso("ok","Monto calculado. Última actualización: "+p.fecha);
        else aviso("ok","Km y casetas listos. Ida y vuelta = peaje × 2. Solo ida = peaje × 1.");
      }).catch(function(){
        peajeIda=null;
        document.getElementById("casetas").value="";
        document.getElementById("casetas").className="yel";
        aviso("err",AVISO_ERR);
      });
    }).catch(function(){
      document.getElementById("kmIda").className="yel";
      document.getElementById("kmReg").className="yel";
      document.getElementById("casetas").className="yel";
      aviso("err",AVISO_ERR);
    }).then(function(){btn.disabled=false});
  }

  document.getElementById("aceptarRuta").onclick=rutaAuto;

    peajeIda=cas;
    aviso("ok","Cambios aplicados. Pulsa Calcular para ver el resultado.");

  function diasFechas(){
    var a=document.getElementById("fini").value, b=document.getElementById("ffin").value;
    if(!a||!b)return {n:0,d:0};
    var df=Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000);
    if(df<0)df=0;
    return {n:df,d:df+1};
  }
  function syncFechas(){
    var x=diasFechas();
    document.getElementById("noches").value=x.n;
    document.getElementById("dias").value=x.d;

    document.getElementById("dChofer").value=x.d;
    document.getElementById("uComida").value=x.d*3;

  function vehSel(){

  function pintarRes(rows){
    var s=vehSel();
    var nCol=1+(s.v6?1:0)+(s.v14?1:0)+((!s.v6&&!s.v14)?1:0);
    var head="<tr><th></th>";
    if(s.v6)head+="<th>6 pas</th>";
    if(s.v14)head+="<th>13 pas</th>";
    if(!s.v6&&!s.v14)head+="<th>—</th>";
    head+="</tr>";
    document.getElementById("resHead").innerHTML=head;
    var html="";
    rows.forEach(function(r){
      var kind=r[3]||"";
      if(kind==="sec"||kind==="ref"){
        html+='<tr class="'+(kind==="ref"?"nota":"sec")+'"><td colspan="'+nCol+'">'+r[0]+"</td></tr>";
        return;
      }
      if(kind==="edit"){
        html+="<tr><td>"+r[0]+"</td>";
        if(s.v6)html+='<td><input class="inpAj yel" id="aj6" type="number" step="1" value="'+Math.round(r[1])+'"></td>';
        if(s.v14)html+='<td><input class="inpAj yel" id="aj14" type="number" step="1" value="'+Math.round(r[2])+'"></td>';
        if(!s.v6&&!s.v14)html+='<td class="n">'+money(0)+"</td>";
        html+="</tr>";
        return;
      }

  function loadScript(src){
    return new Promise(function(res,rej){
      var s=document.querySelector('script[data-lib="'+src+'"]')||document.querySelector('script[src="'+src+'"]');
      if(s&&s.getAttribute("data-ok")==="1")return res();
      s=document.createElement("script");
      s.src=src;
      s.setAttribute("data-lib",src);
      s.onload=function(){s.setAttribute("data-ok","1");res()};
      s.onerror=function(){s.remove();rej(new Error("script "+src))};
      document.head.appendChild(s);
    });
  }
  function loadFirst(urls,ok){
    var i=0;
    function next(){
      if(ok())return Promise.resolve();
      if(i>=urls.length)return Promise.reject(new Error("lib"));
      return loadScript(urls[i++]).then(function(){return ok()?null:next()}).catch(next);
    }
    return next();
  }

  function pdfLineas(col){

      if(k==="nota"){
        html+='<div class="pdfNota row"><span>'+lab+"</span><b>"+money(val)+"</b></div>";

      if(k==="edit"){
        html+='<div class="pdfLin tot"><span>'+lab+"</span><b>"+money(vAj(col))+"</b></div>";
        return;

  function logoDataUrl(){
    return new Promise(function(res){
      if(!LOGO_MB)return res("");
      var im=new Image();
      im.onload=function(){
        var c=document.createElement("canvas");
        var s=Math.min(im.width,im.height,512);
        c.width=s; c.height=s;
        var g=c.getContext("2d");
        g.fillStyle="#ffffff";
        g.fillRect(0,0,s,s);
        g.drawImage(im,0,0,s,s);
        res(c.toDataURL("image/jpeg",0.92));
      };
      im.onerror=function(){res(LOGO_MB)};
      im.src=LOGO_MB;
    });
  }
  function armarPdfCot(){
    var c=lastCalc||{cob6:0,cob14:0};
    var a6=document.getElementById("aj6"), a14=document.getElementById("aj14");
    var p6=a6?n(a6.value):c.cob6, p14=a14?n(a14.value):c.cob14;
    var nom=document.getElementById("nombre").value||"Público general";
    var tel=document.getElementById("tel").value||"—";
    var hor=document.getElementById("horario").value||"";
    var o=nomOrigen()||"—", d=nomDestino()||"—";
    var fi=fmtFechaQ(document.getElementById("fini").value);
    var ff=fmtFechaQ(document.getElementById("ffin").value);
    var tipo=document.getElementById("tipo").value==="IV"?"IDA Y VUELTA":"SOLO IDA";
    var diasN=document.getElementById("dias").value||"0";
    var obs=document.getElementById("comentarios").value||"";
    var on6=document.getElementById("veh6").checked, on13=document.getElementById("veh14").checked;
    return loadFirst([
      "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
    ],function(){return !!(window.jspdf&&window.jspdf.jsPDF)}).then(function(){
      var JsPDF=window.jspdf.jsPDF;
      var pdf=new JsPDF({unit:"mm",format:"a4",orientation:"p"});
      return Promise.all([logoDataUrl(),loadPdfFonts(pdf)]).then(function(arr){
      var logo=arr[0];
      var W=210, m=14, cw=W-m*2, g=3.5, y=8, cx=W/2;
      if(logo){
        try{
          var fmt=logo.indexOf("image/jpeg")>=0?"JPEG":"PNG";
          pdf.addImage(logo,fmt,cx-10,y,20,20);
        }catch(e1){
          try{pdf.addImage(logo,"PNG",cx-10,y,20,20)}catch(e2){}
        }
        y+=21;
      }
      pdf.setFont(pdfFont,"bold");
      pdf.setFontSize(15);
      pdfInk(pdf,"#0f172a");
      pdf.text("MB RAIT VALPA ZAC", cx, y, {align:"center"});
      y+=5.2;
      pdf.setFont(pdfFont,"normal");
      pdf.setFontSize(10);
      pdfInk(pdf,"#64748b");
      pdf.text("492 223 3227", cx, y, {align:"center"});
      y+=5;
      pdf.setFontSize(7.5);
      pdfInk(pdf,"#94a3b8");
      pdf.text(pdfNombre, cx, y, {align:"center"});
      y+=5;
      var badge="COTIZACIÓN EXPRESS";
      pdf.setFont(pdfFont,"bold");
      pdf.setFontSize(7);
      var bw=pdf.getTextWidth(badge)+8;
      pdfBox(pdf,(W-bw)/2,y,bw,6.4,"#f1f5f9",3.2);
      pdfInk(pdf,"#334155");
      pdf.text(badge,cx,y+4.4,{align:"center"});
      y+=9.5;
      function cell(x,lab,val,w,h){
        pdfBox(pdf,x,y,w,h,"#f8fafc",3);
        pdf.setFont(pdfFont,"bold");
        pdf.setFontSize(6);
        pdfInk(pdf,"#94a3b8");
        pdf.text(lab.toUpperCase(), x+3.5, y+4.6);
        pdf.setFontSize(10);
        pdfInk(pdf,"#0f172a");
        var lines=pdf.splitTextToSize(String(val), w-7);
        pdf.text(lines, x+3.5, y+10.2);
      }
      var col=(cw-g)/2, h1=15;
      cell(m,"Nombre",nom,col,h1);
      cell(m+col+g,"Tel. contacto",tel,col,h1);
      y+=h1+g;
      cell(m,"Fecha inicial",fi,col,h1);
      cell(m+col+g,"Fecha final",ff,col,h1);
      y+=h1+g;
      if(hor){
        cell(m,"Horario",hor,cw,h1);
        y+=h1+g;
      }
      var rh=24, rw=(cw-12)/2;
      pdfBox(pdf,m,y,rw,rh,"#15803d",4);
      pdf.setFontSize(6); pdfInk(pdf,"#ffffff"); pdf.setFont(pdfFont,"bold");
      pdf.text("ORIGEN", m+rw/2, y+7.2, {align:"center"});
      pdf.setFontSize(11);
      pdf.text(pdf.splitTextToSize(o, rw-8), m+rw/2, y+14, {align:"center"});
      pdfInk(pdf,"#86efac");
      pdf.setFontSize(12);
      pdf.text("→", m+rw+6, y+14.2, {align:"center"});
      pdfBox(pdf,m+rw+12,y,rw,rh,"#15803d",4);
      pdf.setFontSize(6); pdfInk(pdf,"#ffffff"); pdf.setFont(pdfFont,"bold");
      pdf.text("DESTINO", m+rw+12+rw/2, y+7.2, {align:"center"});
      pdf.setFontSize(11);
      pdf.text(pdf.splitTextToSize(d, rw-8), m+rw+12+rw/2, y+14, {align:"center"});
      y+=rh+g;
      cell(m,"Tipo de viaje",tipo,col,h1);
      cell(m+col+g,"Días",diasN,col,h1);
      y+=h1+g;
      function price(x,lab,val,on){
        pdfBox(pdf,x,y,col,20,on?"#ecfdf5":"#f8fafc",4);
        pdf.setFontSize(6); pdf.setFont(pdfFont,"bold");
        pdfInk(pdf,on?"#047857":"#94a3b8");
        pdf.text(lab.toUpperCase(), x+col/2, y+6.2, {align:"center"});
        pdf.setFontSize(14.5);
        pdf.text(on?money(val):"—", x+col/2, y+14.4, {align:"center"});
      }
      price(m,"6 pasajeros",p6,on6);
      price(m+col+g,"13 pasajeros",p14,on13);
      y+=23;
      var notesH=16, footerH=36;
      var maxOh=297-footerH-notesH-y;
      if(maxOh<14)maxOh=14;
      var lineH=3.6;
      var obsLines=pdf.splitTextToSize(obs, cw-10);
      var maxLines=Math.max(2, Math.floor((maxOh-8)/lineH));
      if(obsLines.length>maxLines){
        obsLines=obsLines.slice(0,maxLines);
        var last=String(obsLines[maxLines-1]||"");
        obsLines[maxLines-1]=(last.length>4?last.slice(0,-3):last)+"…";
      }
      var oh=Math.min(8+obsLines.length*lineH, maxOh);
      pdfBox(pdf,m,y,cw,oh,"#f8fafc",4);
      pdf.setFontSize(6); pdfInk(pdf,"#94a3b8"); pdf.setFont(pdfFont,"bold");
      pdf.text("OBSERVACIONES", m+4, y+5);
      pdf.setFontSize(8); pdfInk(pdf,"#475569"); pdf.setFont(pdfFont,"normal");
      pdf.text(obsLines, m+4, y+10.2);
      y+=oh+6;
      pdf.setFontSize(7.5); pdfInk(pdf,"#94a3b8"); pdf.setFont(pdfFont,"normal");
      pdf.text("Es necesario un anticipo para agendar su viaje.", cx, y, {align:"center"});
      pdf.text("Vigencia 1 semana · Precios en MN · IVA solo si requiere factura", cx, y+4.2, {align:"center"});
      y+=10;
      pdf.setFont(pdfFont,"bold"); pdf.setFontSize(10.5); pdfInk(pdf,"#0f172a");
      pdf.text("¡Gracias por viajar con nosotros!", cx, y, {align:"center"});
      pdfPieRedes(pdf,y+1,W,true);
      pdfBlob=pdf.output("blob");
      if(pdfUrl)URL.revokeObjectURL(pdfUrl);
      pdfUrl=URL.createObjectURL(pdfBlob);
      return pdfBlob;
      });
    });
  }
  function canvasAPdf(can){
    var JsPDF=window.jspdf&&window.jspdf.jsPDF;
    if(!JsPDF)throw new Error("jspdf");
    var img;
    try{img=can.toDataURL("image/jpeg",0.86)}catch(e){img=can.toDataURL("image/png")}
    var w=210, h=w*can.height/can.width;
    if(!isFinite(h)||h<40)h=297;
    if(h>2000)h=2000;
    var foot=38;
    var pdf=new JsPDF({unit:"mm",format:[w,h+foot],orientation:"p",compress:true});
    pdf.addImage(img,img.indexOf("image/png")>=0?"PNG":"JPEG",0,0,w,h);
    return loadPdfFonts(pdf).then(function(){
      pdfPieRedes(pdf,h+2,w);
      return pdf.output("blob");
    });
  }
  function armarPdfHtml(){
    var dest=document.getElementById("expPreview");
    dest.innerHTML='<div class="pdfCap">'+htmlPdf()+"</div>";
    var el=dest.querySelector(".pdfCap")||dest;
    return new Promise(function(res){setTimeout(res,120)}).then(function(){
      return loadFirst([
        "https://cdn.jsdelivr.net/npm/html2canvas-pro@1.5.11/dist/html2canvas-pro.min.js",
        "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
      ],function(){return typeof html2canvas==="function"});
    }).then(function(){
      return loadFirst([
        "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js",
        "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
      ],function(){return !!(window.jspdf&&window.jspdf.jsPDF)});
    }).then(function(){
      return html2canvas(el,{
        scale:1.8,
        backgroundColor:"#ffffff",
        useCORS:true,
        allowTaint:false,
        imageTimeout:4000,
        logging:false
      });
    }).then(function(can){
      return Promise.resolve().then(function(){return canvasAPdf(can)}).catch(function(e){
        return new Promise(function(res,rej){
          can.toBlob(function(b){if(!b)return rej(e);res(b)},"image/png");
        });
      }).then(function(b){
        pdfBlob=b;
        if(pdfUrl)URL.revokeObjectURL(pdfUrl);
        pdfUrl=URL.createObjectURL(pdfBlob);
        return pdfBlob;
      });
    });
  }
  function armarPdf(){
    var dest=document.getElementById("expPreview");
    dest.innerHTML='<div class="pdfCap">'+htmlPdf()+"</div>";
    if(pdfKind==="cot")return armarPdfCot();
    return armarPdfHtml();
  }
  function abrirPdf(kind){
    var dest=document.getElementById("expPreview");
    dest.innerHTML='<div class="pdfWait">Generando PDF…</div>';
    document.getElementById("expModal").className="sctModal on";
    return pullNube({par:false}).catch(function(){}).then(function(){
      pdfKind=kind;
      pdfBlob=null;
      pdfNombre=kind==="cot"?sigCot():sigDesg();
      if(kind==="desg")pintarCab();
      else pintarQuote();
      document.querySelector("#expModal .sctHead span").textContent=pdfNombre;
      return armarPdf();
    }).catch(function(){
      dest.innerHTML='<div class="pdfCap">'+htmlPdf()+'</div>';
    });
  }
  document.getElementById("genDes").onclick=function(){abrirPdf("desg")};
  document.getElementById("genCot").onclick=function(){abrirPdf("cot")};
  document.getElementById("expCerrar").onclick=function(){
    document.getElementById("expModal").className="sctModal";
  };
  document.getElementById("expDl").onclick=function(){
    if(pdfBlob)bajarPdf();
    else armarPdf().then(bajarPdf).catch(function(){alert("No se pudo descargar el PDF")});
  };
  document.getElementById("expShare").onclick=function(){
    function go(){compartirArchivo(pdfBlob,pdfNombre+".pdf","application/pdf")}
    if(pdfBlob)go();
    else armarPdf().then(go).catch(function(){alert("No se pudo compartir el PDF")});
  };

  document.getElementById("back").onclick=function(){
    if(history.length>1)history.back(); else location.href="index.html";
  };

  var t=new Date(), iso=t.toISOString().slice(0,10);
  document.getElementById("fini").value=iso;
  document.getElementById("ffin").value=iso;
  syncFechas();
  syncSoloIda();
  resCero();
})();
  </script>
</body>
